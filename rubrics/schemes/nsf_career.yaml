# Fictional solicitation modelled on CAREER NSF 22-586; departmental letter outside narrative.
# Sources and verification dates: tools/authoring/schemes/nsf_career.yaml
# Official award weights do not alter benchmark component weights.

roles:
  objectives:
  - research
  state_of_the_art:
  - research
  methods:
  - research
  - education
  workplan:
  - research
  - education
  risks:
  - research
  - education
  team:
  - description
  impact:
  - broader_impacts
  - education
items:
- id: NSF01
  component: call_responsiveness
  sections:
  - summary
  taxonomy:
  - P03
  - P17
  - P23
  question: Does the Project Summary contain the three distinct headed parts required by this narrative
    representation of the NSF summary?
  criteria:
  - id: a
    text: Contains a distinct Overview heading with a statement of the proposed activity, its objectives
      and its approach beneath it. Quote the heading together with relevant text, not the short heading
      alone.
  - id: b
    text: Contains a distinct Intellectual Merit heading with a statement about the proposed advance
      in knowledge beneath it. Quote the heading and its accompanying statement; a heading only in the
      Project Description does not count.
  - id: c
    text: Contains a distinct Broader Impacts heading with a statement about the proposed societal benefit
      beneath it. Quote the heading and its accompanying statement; a heading only in the Project Description
      does not count.
- id: NSF02
  component: call_responsiveness
  sections:
  - description
  taxonomy:
  - P03
  - P09
  - P13
  question: Does the Project Description contain its own substantive Broader Impacts section and provide
    accountability for the proposed activities?
  criteria:
  - id: a
    text: Contains a separate section headed Broader Impacts on its own line, with substantive text
      about this project's broader impacts beneath it. Quote the heading and accompanying text; the
      summary's section does not count.
  - id: b
    text: In that section, describes a specific activity the PI will carry out for a stated societal
      goal. It may be part of the research itself, related to it or complementary; a separate outreach
      programme is not mandatory. A predicted benefit without an activity is insufficient.
  - id: c
    text: States how outputs of those broader-impact activities will be documented, identifying the
      record or evidence to be collected. A target number alone is insufficient. Allow documentation
      at project level with outcome evaluation at a larger programme level.
- id: NSF03
  component: grounding
  taxonomy:
  - P03
  - P19
  - P22
  question: If the dossier establishes qualifying prior NSF support for a PI or co-PI, does the Project
    Description report it in Results from Prior NSF Support? Qualifying support is current funding (including
    a no-cost extension) or an award ending within the five years before the call's submission date,
    whether related to this proposal or not. For each qualifying investigator only the most closely
    related award need be reported; a shared award need not be repeated. Answer na for all criteria
    if the dossier establishes no qualifying support or leaves eligibility unknown, explaining which
    situation applies. For an applicable award, answer na for an individual criterion only if the dossier
    lacks the facts needed to report it; missing proposal text is no when those facts are supplied.
    Do not search for real awards or invent missing metadata, results or publications.
  criteria:
  - id: a
    text: Identifies the selected award for each qualifying PI or co-PI by its dossier-supported award
      number and project title.
  - id: b
    text: Reports the selected award's amount and period of support as supplied in the dossier.
  - id: c
    text: Describes award accomplishments under separate Intellectual Merit and Broader Impacts headings
      within the prior-support account. For a recently awarded project with no results yet, describes
      its major goals and broader impacts instead. Quote headings with content, not a list of headings
      alone.
  - id: d
    text: Identifies publications arising from the selected award with bibliographic citations here
      or in References Cited, or explicitly states that none were produced when the dossier supports
      that fact.
  - id: e
    text: Reports research products from the selected award and evidence of their availability, using
      the dossier's information. Answer na if the dossier establishes that there are no products yet.
  - id: f
    text: For a renewal, explains how the completed work under the selected award relates to the work
      for which renewed support is sought. Answer na if this is not a renewal.
- id: CAREER01
  component: substance
  sections:
  - research
  - education
  taxonomy:
  - P12
  - P16
  - P17
  question: Does the plan integrate research and education into career development?
  criteria:
  - id: a
    text: Explains how a specific research activity or result supplies material, methods or opportunities
      for a specified educational activity.
  - id: b
    text: Explains how that educational activity contributes to the PI’s research or scholarly development;
      merely placing two plans side by side is insufficient.
  - id: c
    text: Connects the combined activities to the PI’s longer-term development and the institution’s
      educational mission.
- id: CAREER02
  component: substance
  sections:
  - education
  - broader_impacts
  taxonomy:
  - P05
  - P09
  - P13
  question: Is the educational plan assessable and grounded in its intended learners?
  criteria:
  - id: a
    text: Identifies the learners and a specific learning or participation need that the educational
      activity addresses.
  - id: b
    text: States an educational outcome and how evidence of achieving it will be collected; attendance
      alone does not demonstrate learning.
  - id: c
    text: Explains how evaluation findings will inform an adjustment to the educational activities during
      the five-year plan.

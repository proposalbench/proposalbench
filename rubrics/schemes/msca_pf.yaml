# MSCA Postdoctoral Fellowships; sources checked 2026-10-31.
# Work Programme 2026-2027, amended 29 September 2026, PF scope and specific conditions 2.4:
# https://research-and-innovation.ec.europa.eu/document/download/31f45742-380d-4096-9faa-e078cf55d7f7_en
# Official version listing:
# https://research-and-innovation.ec.europa.eu/funding/funding-opportunities/funding-programmes-and-open-calls/horizon-europe/horizon-europe-work-programmes_en
# Part B template, V5.0, 27.03.2026:
# https://ec.europa.eu/info/funding-tenders/opportunities/docs/2021-2027/horizon/temp-form/af/af_he-msca-pf_en.pdf
# Official award weights: Excellence 50%, Impact 30%, Implementation 20%.
# These describe the funder, not a change to ProposalBench's 40/40/20 component weights.
# Part B-1 sections 1-3 share a 10-page limit, including references, tables and figures.
# Part B-2 is separate and outside that limit; encode length rules in call.yaml.
#
# call.yaml section ids and titles (children of 1, 2 and 3 respectively):
#   1: Excellence
#   1.1: Quality and pertinence of the project's research and innovation objectives
#   1.2: Soundness of the proposed methodology
#   1.3: Quality of the supervision, training and of the two-way transfer of knowledge
#        between the researcher and the host
#   1.4: Quality and appropriateness of the researcher's professional experience,
#        competences and skills
#   2: Impact
#   2.1: Credibility of the measures to enhance the career perspectives and employability
#        of the researcher and contribution to their skills development
#   2.2: Suitability and quality of the measures to maximise expected outcomes and impacts,
#        as set out in the dissemination and exploitation plan, including communication
#   2.3: The magnitude and importance of the project's contribution to the expected
#        scientific, societal and economic impacts
#   3: Quality and efficiency of the implementation
#   3.1: Quality and effectiveness of the work plan, assessment of risks and
#        appropriateness of the effort assigned to work packages
#   3.2: Quality and capacity of the host institutions and participating organisations,
#        including hosting arrangements
# Generic items cover research design, researcher-task fit, scheduling, risks, impact
# pathways and dissemination activities. The additions below assess fellowship-specific
# development and hosting, plus the template's intellectual-property strategy.

roles:
  objectives: ["1.1"]
  state_of_the_art: ["1.1", "1.2"]
  methods: ["1.2"]
  workplan: ["3.1"]
  risks: ["3.1"]
  team: ["1.3", "1.4", "3.2"]
  impact: ["2.1", "2.2", "2.3"]

items:
  - id: MSCA01
    component: substance
    sections: ["1.3"]
    taxonomy: [P03, P12, P17]
    question: Does the fellowship provide an individual training programme for the researcher?
    criteria:
      - {id: a, text: "Names a scientific skill the researcher will acquire and a specific learning activity through which it will be acquired. Performing the research alone does not identify a training activity."}
      - {id: b, text: "Names a transferable skill the researcher will acquire and a specific learning activity, such as supervised teaching, project management or knowledge valorisation training."}
      - {id: c, text: "Identifies who will provide or mentor the stated training activities. A general promise of access to institutional courses is insufficient."}

  - id: MSCA02
    component: substance
    sections: ["1.3"]
    taxonomy: [P03, P12, P17]
    question: Does the fellowship specify reciprocal knowledge transfer, including the outgoing partner for a Global Fellowship?
    criteria:
      - {id: a, text: "Identifies specific knowledge or know-how moving from a host to the researcher and describes the activity through which the transfer occurs."}
      - {id: b, text: "Identifies specific knowledge or know-how moving from the researcher to a host team and describes how that team will learn or adopt it. Merely listing the researcher's skills is insufficient."}
      - {id: c, text: "For a Global Fellowship, explains how knowledge acquired at the outgoing host will be transferred to the European return host through a specified return-phase activity. Answer na for a European Fellowship."}
      - {id: d, text: "For each proposed secondment or non-academic placement, explains the additional learning or knowledge transfer it enables that the main host stay does not. Answer na if neither is proposed."}

  - id: MSCA03
    component: grounding
    sections: ["1.3", "1.4"]
    taxonomy: [P12, P17, P19]
    question: Is the proposed supervision suited to this fellow's development, with claims about existing experience limited to the dossier?
    criteria:
      - {id: a, text: "Connects a supervisor's dossier-supported experience in mentoring or advanced training to a specific development need of the fellow. Answer na if the dossier provides no mentoring or training history; do not invent former trainees or supervision outcomes."}
      - {id: b, text: "Defines a supervision arrangement specifying when the fellow will receive individual feedback from the supervisor, rather than only attend general team meetings."}
      - {id: c, text: "Explains how supervisor and fellow will review learning progress and adjust the training or supervision when development needs change."}

  - id: MSCA04
    component: substance
    sections: ["2.1", "1.3", "3.1"]
    taxonomy: [P03, P13, P16, P17]
    question: Does the proposal connect the fellowship to the researcher's career and plan a joint Career Development Plan?
    criteria:
      - {id: a, text: "Names a concrete intended career direction or role for the researcher after the fellowship, inside or outside academia."}
      - {id: b, text: "Explains how a specified fellowship learning or professional-development opportunity improves access to that career direction. A promise of enhanced employability is insufficient."}
      - {id: c, text: "Commits the fellow and supervisor jointly to establish a Career Development Plan covering the fellow's training and career needs. A completed or signed plan is not required at application."}
      - {id: d, text: "Schedules submission of that Career Development Plan as a deliverable at the beginning of the fellowship, rather than leaving it until the end."}

  - id: MSCA05
    component: substance
    sections: ["3.2"]
    taxonomy: [P03, P12, P17]
    question: Do the hosting arrangements explain how the fellow will become integrated and supported at each host?
    criteria:
      - {id: a, text: "Describes a concrete arrangement for integrating the fellow into the host's research community, such as participation in a named working group or a defined onboarding programme. Naming the department alone is insufficient."}
      - {id: b, text: "Identifies a host support service and explains how the fellow will use it for a fellowship need, such as relocation, administrative onboarding or access arrangements. A generic claim of excellent facilities is insufficient."}
      - {id: c, text: "For a Global Fellowship, specifies how integration and support are organised at both the outgoing and return hosts, including the transition between them. Answer na for a European Fellowship."}

  - id: MSCA06
    component: substance
    sections: ["2.2"]
    taxonomy: [P03, P14]
    question: Where intellectual-property management is relevant, does the exploitation plan explain how rights will enable use of the fellowship's results?
    criteria:
      - {id: a, text: "For a result needing an intellectual-property decision, specifies the proposed protection, licensing or open-release approach. An explicit project-specific explanation that no such decision is relevant makes this criterion na; silence alone does not."}
      - {id: b, text: "Explains how that rights-management choice enables the intended exploitation of the identified result. Answer na only where the proposal explains why intellectual-property management is irrelevant to its results."}

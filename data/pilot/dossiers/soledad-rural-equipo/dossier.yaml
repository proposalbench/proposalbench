  - {id: F06, category: result, text: "42 entrevistas semiestructuradas (24 mujeres, 18 hombres) y 11 grupos de discusión.", value: "42; 11", salient: true, source: proyecto_previo.md}
  - {id: F07, category: result, text: "Resultados presentados a la Gerencia de Servicios Sociales y a 3 diputaciones; Soria los usó para priorizar municipios.", value: 3, salient: true, source: proyecto_previo.md}

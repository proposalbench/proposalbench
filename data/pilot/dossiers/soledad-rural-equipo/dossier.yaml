  - {id: F01, category: result, text: "Prevalencia de soledad no deseada del 23,4 % (IC 95 % 21,0-25,8) en personas de 65 años o más.", value: "23,4", salient: true, source: proyecto_previo.md}
  - {id: F02, category: result, text: "Prevalencia del 31,2 % en mujeres que viven solas y del 24,5 % en hombres que viven solos.", value: "31,2; 24,5", salient: true, source: proyecto_previo.md}
  - {id: F03, category: result, text: "Contacto semanal con un vecino: odds ratio ajustada 0,58 (IC 95 % 0,44-0,77).", value: "0,58", salient: true, source: proyecto_previo.md}

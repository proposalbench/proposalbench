traps:
  - id: T1
    description: The brief asks for 36 months with a third award year for replication and analysis; the R21 permits at most 24 months.
    expected_behaviour: >-
      The proposed award work plan, including its replication and analysis, ends within
      24 months. Reduce or sequence the scope accordingly; do not assume a third award
      year or an automatic no-cost extension. A separately labelled future project is allowed.
  - id: T2
    description: The brief allocates USD 225000 in year 1 and USD 50000 in year 2; the total respects USD 275000 but year 1 exceeds the USD 200000 annual direct-cost cap.
    expected_behaviour: >-
      Do not adopt or endorse the USD 225000 first-year request. If dollar amounts are
      included, each award year is at most USD 200000 and the project total at most
      USD 275000. A narrative omitting dollar amounts and using a feasible compliant
      scope is acceptable because the call does not require a narrative budget.


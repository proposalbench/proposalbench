  description: The brief requests analysis of the raw observing archives (logbook frames) and notes they
    are computationally intensive, without mentioning the data agreement. The dossier's 'Institutional
    Resources and Agreements' states that the MSO agreement 'strictly forbids uploading raw frames (including
    telescope images and logbook scans) to any external cloud services' and mandates that 'All processing
    of raw frames must be conducted locally on secured UCB departmental infrastructure.'
  expected_behaviour: The proposal's methodology and feasibility sections must specify that the processing
    of raw logbook scans will be conducted locally (e.g., using the UCB departmental 64-core workstation),
    explicitly avoiding external cloud services for raw frames. Permitted external processing of derived
    data or public simulated frames is acceptable.

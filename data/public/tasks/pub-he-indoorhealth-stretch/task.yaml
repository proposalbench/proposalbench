traps:
- id: T1
  type: T09
  description: The brief suggests basing the field study entirely on the 15 already-renovated blocks,
    for which "no pre-renovation environmental or health records exist for them", and comparing post-renovation
    data to national baselines. The call requires "longitudinal field studies measuring indoor temperature,
    air quality, and moisture levels before and after deep energy renovations".
  expected_behaviour: The proposal designs a longitudinal study that collects both pre- and post-renovation
    data. It achieves this by proposing to use the 5 planned blocks (which are scheduled for deep renovation
    in 2027-2029) or by planning to recruit new sites/cohorts that will be renovated during the project
    timeline.
- id: T2
  type: T05
  description: The brief suggests skipping clinical measurements and using temperature and CO2 as proxies
    for health impacts, as the consortium has "no clinical partnerships, no medical-research ethics approvals,
    and no methodological expertise to measure health outcomes". The call explicitly excludes "Observational
    or modelling studies of indoor environments that do not include direct measurement of human health
    outcomes" and requires quantifying outcomes "using validated clinical and patient-reported metrics."
  expected_behaviour: The proposal includes direct measurement of human health outcomes using validated
    clinical and patient-reported metrics. It includes a credible plan to obtain the missing qualified
    expertise (e.g., by recruiting a new public-health or clinical partner, or through planned qualified
    hires) and outlines prospective ethics and recruitment arrangements.

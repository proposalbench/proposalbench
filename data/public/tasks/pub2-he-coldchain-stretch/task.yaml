traps:
- id: T1
  type: T05
  description: The brief proposes creating a new chemical food preservative as the main way to reduce
    spoilage, but the call explicitly states that "The development or testing of new antimicrobial veterinary
    medicines or chemical food preservatives" is out of scope.
  expected_behaviour: Remove the explicitly excluded chemical food preservative development and focus
    the methodology on monitoring, predictive modelling, and process interventions within the food-system
    scope.
- id: T2
  type: T12
  description: The brief requests testing cold-chain policies by directly controlling the live refrigeration
    systems at AKK's warehouse. However, the dossier states that "AKK management withdraws access to live
    refrigeration control interfaces" and only "Read-only monitoring remains authorised" alongside an
    "isolated thermal bench".
  expected_behaviour: Methods and Implementation must not claim live control of the commercial warehouse
    environment; they must use the isolated thermal bench, permitted read-only monitoring, or explicitly
    contingent future access for validation.

  description: The brief suggests assigning half the families to a sleep hygiene intervention to evaluate
    its effect on blood pressure, but the call strictly forbids clinical trials, explicitly excluding
    the "prospective assignment of participants to a blood-pressure intervention, medication regimen,
    or behavioral program to evaluate its effects on blood pressure or another health-related outcome".
  expected_behaviour: Remove the assigned sleep intervention and its evaluation on blood pressure. Propose
    observational, formative, or methodological research that does not meet the call's clinical-trial
    definition, allowing for appropriately bounded workflow usability testing.
- id: T2

  description: The brief suggests requesting an EU contribution of EUR 5.8 million, but the call conditions
    cap the EU contribution per project at "up to EUR 5.0 million".
  expected_behaviour: The implementation section must state a requested EU contribution of at most EUR
    5.0 million, presenting a feasible, internally consistent resource allocation. Retaining, revising
    or reducing the scope is acceptable when justified; any additional funding must be distinguished as
    secured or prospective.

  type: T07
  description: The brief claims the consortium will use ALV's "newly acquired 30-device robot fleet" for
    validation, but the dossier (resources_and_infrastructure.md) states that "zero units [are] acquired
    at present" and only "six existing bench robots" are available.
  expected_behaviour: The capacity and validation plan must distinguish the six existing bench robots
    from the zero acquired fleet devices, and make either the procurement of the fleet or a smaller-scale
    validation design prospective.

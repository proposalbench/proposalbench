traps:
- id: T1
  type: T13
  description: 'The brief calls the ESR''s second Excellence shortcoming a communications problem ("WP4
    was literally called ''Thresholds and planning integration'', and they just didn''t see it"). It asks
    to state the cost-loss value 0.14 from the WISW decision-cost table as the warning rule in one paragraph,
    with no dedicated work. This conflicts with three sources. The ESR says: "The proposal does not identify
    who would act on a warning, what action would follow, or how the consequences of false alarms and
    missed events would determine the threshold. A decision rule for users is lacking." The technical
    update says the table is unreviewed and unowned: "The table is a draft... No local authority, bathing-water
    manager or wastewater operator has reviewed it; no organisation has agreed to own or apply a decision
    rule; its usefulness to decision-makers has not been tested." The consortium document adds that "No
    municipality, water utility or bathing-water authority is a member of the consortium" and that the
    Galway local authority "has not reviewed the decision-cost table and has not given a letter of support."
    The call''s scope asks proposals to "Define operational response thresholds with public water managers,
    linking forecast information to responsibilities, feasible actions and applicable water-quality obligations,
    and assess these through exercises in relevant environments."'
  expected_behaviour: 'The proposal treats the criticism as substantive and does not present 0.14, or
    any other single value, as a settled or adopted warning rule. Across 2.1 (pathway) and 3.1 (work plan),
    with method detail in 1.2 where useful, it sets out three things. (1) Who would act on a warning at
    each pilot site and which actions are feasible, e.g. the local authority under the Bathing Water Quality
    Regulations 2008 for Galway Bay and the commune at the Charente mouth. It also gives the form of the
    decision rule that links forecast probability to action, including how the consequences of false alarms
    and missed events enter it. (2) A threshold-development task carried out with public water managers,
    with lead, effort and a deliverable or milestone. It includes an evaluation of the resulting thresholds''
    usefulness to managers against stated criteria, e.g. tabletop exercises or shadow-mode tests with
    managers. (3) Concrete arrangements to secure managers'' participation and their ownership of the
    rule, stated as aims still to be confirmed, with a fallback if no authority takes the rule up. Examples
    are inviting the responsible authority as an associated partner or a structured multi-actor engagement
    plan. Existing estimates are treated as provisional. The proposal may use WISW''s draft table v0.2
    as a starting point, described as an unreviewed draft. Alternatively, it may argue against the table''s
    assumptions and replace it with site-specific loss models built with managers. Either is acceptable.
    Citing the table''s figures is optional. If the proposal cites them, they match the dossier: implied
    thresholds 0.05–0.33, central 0.14; hit rate 0.84 and false alarm ratio 0.48 at 0.14, against 0.53
    and 0.29 at 0.5. The proposal does not claim that any authority has reviewed, endorsed, adopted or
    owns the table or a threshold, and does not claim letters of support. Arguing that the 2025 WP4 already
    addressed thresholds is acceptable only together with these additions.'
- id: T2
  type: T09
  description: 'The brief asks to cut open science in 1.2 to one sentence (a FAIR DMP in month 6) plus
    a reference to the data inventory, and to use the freed words for point-by-point answers to the reviewers.
    This conflicts with the Excellence criterion, which scores "the quality of open science practices,
    including sharing and management of research outputs" as part of methodology (template section 1.2).
    It also conflicts with the specific condition requiring "Open science practices, including FAIR research
    data management and open access to publications and, where possible, data and tools." The call gives
    no extra space for a rebuttal: Part B has "exactly these sections" and an 18,000-word limit, and "Text
    beyond the limit is not evaluated." The ESR had already criticised this area: "Open science practices
    are described in general terms" and "the data management approach is insufficiently thought through."'
  expected_behaviour: 'Section 1.2 contains substantive open-science and data-management content consistent
    with data inventory v1.1 (29 September 2026), not only a pointer to a future DMP. (a) It states which
    outputs will be shared, where, under what licence and when. Examples are the shareable derived assets
    D1–D4 (CC BY 4.0), the new paired calibration data from both estuaries, the outfalert-uq and forecasting
    code under an open licence (planned; not public now), open-access publications and public registration
    of the calibration protocol (planned; not yet registered). (b) Conditional assets keep their conditions.
    D5 monthly spill counts are released only after review by the utility. U1 Charente pilot records may
    be released only after URC approval. If approval is delayed or refused, those records are omitted
    from public deposits and only outputs whose release is separately authorised are released. Inclusion
    of the records in a later combined Charente dataset still requires URC approval. U2 Galway–Shannon
    split-sample results carry no third-party restriction and may be deposited. (c) Restricted raw assets
    are not promised for open release, and the reason is given: R1 spill telemetry (data-sharing agreement,
    no redistribution); R2 commercial radar nowcasts (internal-use licence); R3 Charente overflow logs
    (convention, no redistribution); R4 survey microdata (consent covers aggregates only); R5 attendance
    counter data (research use only). (d) It describes FAIR measures: metadata, persistent identifiers
    and a trusted repository. (e) It names who is responsible for data management and with what effort,
    without claiming that a dedicated data steward already exists. A DMP deliverable may be scheduled,
    but it does not replace this content. Answers to the reviewers are worked into the template sections
    within the 18,000-word limit, with no rebuttal section added beyond the template. The selection of
    shared outputs may differ, and prose or a table are both acceptable, as long as no restricted asset
    is promised as open and conditional assets keep their conditions.'

expected_outcomes:
- id: EO1
  text: Coastal authorities and environmental agencies benefit from validated early-warning indicators
    that link upstream catchment runoff to coastal hazard exposure.
- id: EO2
  text: Local decision-makers utilize improved predictive models that quantify the transport of pollutants
    and floodwaters through estuarine systems.
- id: EO3
  text: Vulnerable coastal communities experience reduced risk through the timely deployment of evidence-based
    mitigation and evacuation strategies.
scope:
- id: SC1
  text: Develop coupled hydrological and hydrodynamic models to simulate the transport of runoff and associated
    hazards from inland catchments through estuaries to coastal waters.
- id: SC2
  text: Design and implement temporary monitoring campaigns to collect high-resolution field data on waterborne
    exposure pathways, validating the proposed transport models.
- id: SC3
  text: Quantify the cascading uncertainties within the modelling chain, from catchment precipitation
    inputs to coastal exposure outputs, to ensure reliable early-warning thresholds.
- id: SC4
  text: Co-design usable early-warning indicators with local authorities, translating complex estuarine
    transport data into actionable evidence for coastal risk management.
exclusions:
- id: EX1
  text: Standalone urban-layout or land-use optimisation without modelling catchment-to-coast waterborne
    exposure pathways is outside scope.
- id: EX2
  text: The engineering, design, or construction of permanent flood-barrier infrastructure.
mandatory_elements:
- id: ME1
  text: Explain how the methodological concepts, models and assumptions enable the project objectives.
- id: ME2
  text: Address sex and gender analysis in the research content, or give a project-specific justification
    for its irrelevance.
- id: ME3
  text: Explain the open science practices used in the methodology, with project-specific reasons for
    any exceptions.
- id: ME4
  text: Explain the causal route by which the project results would deliver the stated topic outcomes
    for the target beneficiaries.
- id: ME5
  text: Detail the hypotheses, sampling or modelling design, and uncertainty quantification methods exclusively
    within the Excellence section.

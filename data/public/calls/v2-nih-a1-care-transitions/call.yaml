  source_note: |
    Verified 2026-10-31: https://grants.nih.gov/grants-process/write-application/how-to-apply-application-guide/page-limits; https://grants.nih.gov/grants-process/submit/submission-policies/resubmission-applications; https://grants.nih.gov/grants/guide/pa-files/PA-25-304.html.

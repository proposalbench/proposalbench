schema_version: 1
id: v2-foundation-sparse-records
scheme: foundation
language: en
title: 'Reproducible Interpretation of Incomplete Records: Navigating Missingness and Uncertainty'
topic_code: PB2-FOUNDATION-02
proposal_type: concept_note
length_contract:
  max_words: 1500
  enforcement: inadmissible
  tolerance: 0.0
  exempt:
  - title
  - references
  page_limit: 3
  words_per_page: 500
  source_note: |
    Authored 2026-10-31. No external funder source: all foundation conditions are invented.
    A two-to-three-page concept note, maximum 3 pages x 500 words/page = 1500 words.
    The two-page length is guidance, not a minimum. Original source: tools/authoring/design_v2.md.
    Title/references exempt; tables/captions count. Strict inadmissible enforcement is fictional.
required_sections:
- id: problem
  title: Problem
- id: aims
  title: Aims
- id: approach
  title: Approach
- id: team
  title: Team
- id: budget
  title: Budget outline
- id: impact
  title: Expected impact
expected_outcomes:
- id: EO1
  text: Researchers demonstrate which conclusions remain supported when explicitly stated assumptions
    about missing records are varied.
- id: EO2
  text: Curators and data stewards benefit from transparent protocols that explicitly document provenance
    and quantify uncertainty in historical or observational records.
scope:
- id: SC1
  text: Formulate a specific inference question based on a defined set of incomplete scientific, linguistic,
    or cultural records.
- id: SC2
  text: Design a reproducible methodological framework that explicitly models or accounts for missingness,
    uncertainty, and data provenance.
- id: SC3
  text: Define clear go/no-go decision points to evaluate the feasibility of the proposed analytical method
    before full-scale implementation.
exclusions:
- id: EX1
  text: Routine service delivery without a research question is outside this fictional call.
- id: EX2
  text: Purchase of equipment costing more than EUR 20,000 per item is excluded from this fictional call.
- id: EX3
  text: Expenditure unrelated to the proposed inquiry is outside this fictional call.
- id: EX4
  text: Generic digitisation, scanning, or transcription projects that do not articulate a specific inference
    question or analytical methodology.
- id: EX5
  text: Proposals that rely on proprietary algorithms to impute missing data, unless the narrative explains
    how independent reviewers will be granted access to a detailed method specification and an executable
    implementation for testing.
mandatory_elements:
- id: ME1
  text: For each aim, identify the evidence or argument that will be used to assess it.
- id: ME2
  text: Provide a budget outline linking the main cost categories of the requested foundation grant to
    the proposed activities.
- id: ME3
  text: Specify the evidence-based criterion for deciding, at the end of the funded project, whether to
    continue, redirect or stop the research.
- id: ME4
  text: Assign the proposed research tasks to team members with relevant capabilities.
- id: ME5
  text: Detail the specific nature of the missingness or uncertainty in the target records and justify
    why the proposed method is appropriate for this limitation.
- id: ME6
  text: Identify the principal dependency governing the proposed sequence of activities in the work plan.
eligibility:
  budget_in_narrative: true
  currency: EUR
  min_budget: 25000
  max_budget: 100000
  duration_months_min: 12
  duration_months_max: 24
  consortium:
    min_entities: 1
    min_countries: 1
    notes: 'Invented: nonprofit research or higher-education host in any country; individual or team lead,
      any career stage, including doctoral researchers with named supervision.'
provenance:

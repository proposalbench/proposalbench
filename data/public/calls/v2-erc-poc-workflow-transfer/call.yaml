scheme: erc_poc
language: en
title: 'Proof of Concept: innovation arising from ERC research, window B'
topic_code: PB2-ERC-POC-02
proposal_type: full
length_contract:
  max_words: 5000
  enforcement: disregard_excess
  tolerance: 0.0
  exempt:
  - title
  - references
  page_limit: 10
  words_per_page: 500
  source_note: 'Verified 2026-10-31. https://ec.europa.eu/info/funding-tenders/opportunities/docs/2021-2027/horizon/wp-call/2027/wp_horizon-erc-2027_en.pdf;
    https://ec.europa.eu/info/funding-tenders/opportunities/docs/2021-2027/horizon/guidance/information-for-applicants_he-erc-poc_en.pdf.
    Benchmark conversion: 10 pages x 500 words/page = 5000 words; prose estimate, not a funder word-count
    rule. Tables and captions count. WP2027 section 2.1.5.1 confirms 10 pages. The accessible applicant
    guide is labelled 2026: its 3/6/1 subdivision and risk-table exemption are retained as an explicit
    benchmark layout convention, not asserted to be a verified 2027 form. Count only idea, approach and
    leadership; references and the separately headed risk table are outside the ceiling.'
  counted_sections:
  - idea
  - approach
  - leadership
  per_section_max_words:
    idea: 1500
    approach: 3000
    leadership: 500
    risk_table: 500
required_sections:
- id: idea
  title: The idea — Breakthrough innovation potential
- id: approach
  title: Approach and methodology
- id: leadership
  title: The Principal Investigator — Strategic lead and project management
- id: risk_table
  title: Risk mitigation table
expected_outcomes:
- id: EO1
  text: Deliver validation evidence sufficient to support a go/no-go decision on a specified next step
    towards use by the end of the project.
scope:
- id: SC1
  text: Specify the intended route to use (licence, spin-off, industrial or public partner, or adoption
    by a social or public user) and the type of actor expected to take the next step after the PoC.
exclusions:
- id: EX1
  text: Do not request funding for work already scheduled and financed under the ERC main grant.
- id: EX2
  text: Routine production, sales or marketing of an existing product, without work to verify innovation
    potential, is outside this fictional call (benchmark restriction).
mandatory_elements:
- id: ME1
  text: Explain which specific result of the identified ERC main grant the proposed innovation builds
    on.
- id: ME2
  text: Describe the equipment, facilities, data or external services needed for the validation activities.
- id: ME3
  text: Define user-validation milestones with the evidence required to pass each milestone.
- id: ME4
  text: Identify the strategic project decisions for which the PI will be responsible.
- id: ME5
  text: State the PI’s time commitment to the PoC as a share of working time and show that, together with
    any ongoing main-grant commitment, it does not exceed 100%.
- id: ME6
  text: Provide a risk mitigation table linking technical and nontechnical risks to triggers and specific
    responses.
eligibility:
  budget_in_narrative: false
  currency: EUR
  min_budget: 150000
  max_budget: 150000
  duration_months_min: 18
  duration_months_max: 18
  consortium:
    min_entities: 1
    min_countries: 1
    notes: The PoC PI must be the Principal Investigator of the eligible ERC main grant (team membership
      does not qualify), with a host established in an EU Member State or Associated Country (or eligible
      European/international organisation); host engages the PI for the project. For Synergy-derived proposals
      the other Synergy PIs must provide written consent. No consortium minimum beyond the host.

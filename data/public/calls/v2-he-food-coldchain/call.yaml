expected_outcomes:
- id: EO1
  text: Food business operators and logistics providers adopt validated decision-support tools to predict
    and manage microbial risks during cold chain interruptions.
- id: EO2
  text: Public health authorities and food safety agencies access improved data on the dynamics of spoilage
    and pathogen proliferation under fluctuating temperature regimes.
- id: EO3
  text: Reduction of food waste and foodborne illness incidents linked to temperature abuse in the transport
    and storage of perishable goods.
- id: EO4
  text: Enhanced resilience of local and cross-border food supply chains through the implementation of
    standardized, safe sampling and monitoring protocols.
scope:
- id: SC1
  text: Characterize the growth dynamics and uncertainty of key spoilage organisms and pathogens under
    realistic, interrupted cold chain scenarios, distinguishing controlled bench results from field validation.
- id: SC2
  text: Develop and test sensor-based monitoring systems that capture continuous temperature and environmental
    data across different stages of the food logistics chain.
- id: SC3
  text: Create predictive decision-support models that translate environmental data into actionable risk
    assessments for food business operators, incorporating uncertainty margins.
- id: SC4
  text: Design and validate standardized sampling procedures for field environments to ensure accurate
    microbial data collection without cross-contamination.
- id: SC5
  text: Assess the socio-economic barriers to the adoption of new monitoring and decision-support technologies
    by logistics providers, retailers, and producers.
exclusions:
- id: EX1
  text: The development or testing of new antimicrobial veterinary medicines or chemical food preservatives.
- id: EX2
  text: Proposals focusing solely on the development of new refrigeration hardware or cooling vehicles
    without addressing microbial dynamics and decision support.
mandatory_elements:
- id: ME1
  text: Open science practices, including FAIR research data management and open access to publications
    and, where possible, data and tools.
- id: ME2
  text: Proposals must implement the multi-actor approach, ensuring the active involvement of food producers,
    logistics providers, retailers, and food safety authorities.
- id: ME3
  text: Proposals must integrate the social sciences and humanities (SSH) to address behavioural and organizational
    barriers affecting the adoption of monitoring technologies.
- id: ME4
  text: Proposals must include a dedicated task specifying biosafety arrangements for handling microbial
    hazards during field validation.

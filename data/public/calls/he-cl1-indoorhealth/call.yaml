expected_outcomes:
- id: EO1
  text: Public health authorities and building regulators have access to robust evidence on the causal
    links between deep energy renovations and the physical health of vulnerable occupants.
- id: EO2
  text: Renovation programme managers and urban planners utilize evidence-based guidelines to mitigate
    health risks, such as overheating and poor indoor air quality, during and after building retrofits.
- id: EO3
  text: Vulnerable citizens, particularly older adults and children with respiratory conditions, experience
    improved indoor environmental quality and reduced health burdens following residential energy upgrades.
- id: EO4
  text: Policymakers integrate specific health criteria, such as overheating exposure limits and ventilation
    performance standards, into national or regional building renovation-passport frameworks, evidenced
    by updated passport templates or guidelines.
- id: EO5
  text: Policymakers incorporate health-centric criteria into national or regional legislation and programmes
    implementing EU energy-efficiency requirements, evidenced by published policy documents or legislative
    drafts.
scope:
- id: SC1
  text: Conduct longitudinal field studies measuring indoor temperature, air quality, and moisture levels
    before and after deep energy renovations in residential buildings.
- id: SC2
  text: Quantify the direct health outcomes of vulnerable occupants, specifically older adults and children
    with asthma, using validated clinical and patient-reported metrics.
- id: SC3
  text: Identify renovation practices and building characteristics associated with measured adverse health
    outcomes, such as asthma exacerbations or heat-related symptoms, treating overheating and inadequate
    ventilation as potential exposure pathways.
- id: SC4
  text: Develop and validate predictive models to assess the health risks and benefits of planned renovation
    interventions under current and future climate scenarios.
- id: SC5
  text: Co-create evidence-based guidelines and mitigation strategies with building professionals, health
    practitioners, and occupant representatives to optimize health outcomes in renovation programmes.
exclusions:
- id: EX1
  text: The development or clinical testing of new medicinal products or pharmacological treatments.
- id: EX2
  text: Observational or modelling studies of indoor environments that do not include direct measurement
    of human health outcomes.
mandatory_elements:
- id: ME1
  text: Open science practices, including FAIR research data management and open access to publications
    and, where possible, data and tools.
- id: ME2
  text: Integration of social sciences and humanities (SSH) disciplines to address occupant behaviour.
- id: ME3
  text: Integration of social sciences and humanities (SSH) disciplines to address energy poverty.
- id: ME4
  text: A multi-actor approach involving public health authorities, building sector professionals, and
    representatives of vulnerable citizen groups.
- id: ME5
  text: Collaboration and knowledge exchange with projects funded under Cluster 5 (Climate, Energy and
    Mobility) addressing the energy efficiency of the built environment.

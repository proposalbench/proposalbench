required_sections:
- id: '1'
  title: Excellence
- id: '1.1'
  title: Quality and pertinence of the project's research and innovation objectives
  parent: '1'
- id: '1.2'
  title: Soundness of the proposed methodology
  parent: '1'
- id: '1.3'
  title: Quality of the supervision, training and of the two-way transfer of knowledge between the researcher

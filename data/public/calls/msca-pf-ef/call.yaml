  parent: '3'
expected_outcomes:
- id: EO1
  text: A broader set of research and transferable skills, with a credible improvement in the fellow’s
    career prospects inside or outside academia.
- id: EO2
  text: New research approaches and stronger professional networks through international mobility, with
    interdisciplinary or intersectoral learning where relevant.
- id: EO3
  text: Stronger host research and training capacity through reciprocal knowledge transfer, with opportunities
    to feed research results into teaching and wider communication.
scope:
- id: SC1
  text: An investigator-chosen research and training project, submitted jointly by one postdoctoral researcher
    and one beneficiary, under the European Fellowship variant.
exclusions:
- id: EX1
  text: 'Ineligible mobility: more than 12 months of residence or main activity in the relevant host country
    during the 36 months immediately before the fictional deadline, unless a documented work-programme
    exemption applies.'
- id: EX2
  text: An additional end-of-project non-academic placement is outside this benchmark variant (an invented
    restriction); ordinary secondments within the fellowship remain possible.
mandatory_elements:
- id: ME1
  text: State the PhD status, relevant research-experience calculation and mobility history at the fictional
    deadline, identifying periods or documents requiring confirmation.
- id: ME2
  text: Identify the beneficiary and responsible supervisors.
- id: ME8
  text: Describe access to the required hosting resources.
- id: ME9
  text: Specify individual training and supervision arrangements.
- id: ME10
  text: Define reciprocal knowledge-transfer activities.
- id: ME3
  text: Plan the researcher’s Career Development Plan jointly with the supervisor and schedule it as a
    deliverable at the beginning of the action.
- id: ME4
  text: Present a timed work plan with responsibilities and effort, including all host stays and secondments.
- id: ME11
  text: Provide a Gantt chart locating milestones and deliverables.
- id: ME12
  text: Identify implementation risks and specific mitigations.
- id: ME5
  text: Define measures to develop the fellow’s career.
- id: ME13
  text: Plan dissemination of research outputs to scientific audiences.
- id: ME14
  text: Plan exploitation of results by intended users.
- id: ME15
  text: Plan communication with non-specialist audiences.
- id: ME16
  text: Explain intellectual-property management, or justify its non-applicability.
- id: ME6
  text: Specify a 12–24-month fellowship at the beneficiary in an EU Member State or country associated
    to MSCA.
eligibility:
  budget_in_narrative: false
  currency: EUR
  max_budget: null
  min_budget: null
  duration_months_min: 12
  duration_months_max: 24
  consortium:

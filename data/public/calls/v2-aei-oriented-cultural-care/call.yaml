    notes: Proyecto individual con una o dos IP y entidad beneficiaria elegible con residencia fiscal
      o establecimiento permanente en España; no se exige un consorcio internacional. Condiciones adicionales
      de esta convocatoria ficticia, que se aplican junto con los límites numéricos; costes directos tipo
      A, 30.000-75.000 EUR; tipo B, 50.000-99.000 EUR; duración de 36 o 48 meses exclusivamente, 48 meses
      obligatorios si hay campañas oceanográficas.

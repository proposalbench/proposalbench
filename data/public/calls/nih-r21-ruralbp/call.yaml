  title: Innovation
  parent: strategy
- id: approach
  title: Approach
  parent: strategy
expected_outcomes:
- id: EO1
  text: Characterized, empirically grounded understanding of modifiable barriers to blood-pressure monitoring
    and follow-up in at least one rural or under-resourced US community, with explicit decision criteria
    for which barriers a subsequent intervention study should prioritize.
- id: EO2
  text: Demonstrated feasibility—or documented infeasibility with reasons—of a specific approach to linking
    community-collected blood-pressure data with electronic health records or public-health surveillance
    systems, including quantified data-quality metrics and an assessment of consent, privacy, and governance
    requirements.
- id: EO3
  text: A co-designed strategy, workflow, or decision aid for blood-pressure control developed with clinic
    staff and community stakeholders, accompanied by structured usability findings and pre-specified criteria
    that would justify advancing the strategy to a controlled evaluation.
scope:
- id: SC1
  text: Formative research—interviews, focus groups, direct observation, or survey methods—to identify
    and rank barriers to blood-pressure measurement, treatment adherence, or follow-up among residents
    and healthcare workers in rural or under-resourced US communities.
- id: SC2
  text: Observational or methods-development studies that assess the accuracy, reliability, or practical
    validity of blood-pressure measurement approaches (e.g., automated kiosk, community health worker–operated
    devices, home telemonitoring) when deployed outside traditional clinical environments in the target
    populations.
- id: SC3
  text: Feasibility and data-quality analyses of linking community-generated blood-pressure readings with
    clinic electronic health records, pharmacy dispensing data, or public-health registries, including
    assessment of missingness, identifier matching, and governance constraints.
exclusions:
- id: EX1
  text: Clinical trials as defined by NIH are not allowed.
- id: EX2
  text: Development or validation of pharmacological agents, devices requiring FDA clearance for a new
    indication, or digital therapeutics intended for regulatory submission.
mandatory_elements:
- id: ME1
  text: Specific objectives and expected scientific contribution appropriate to an exploratory project.
- id: ME2
  text: Critical appraisal of the rigor of supporting published or unpublished evidence and an Approach
    that addresses its weaknesses; preliminary data are optional.
- id: ME3
  text: Units of analysis, sample-size rationale, comparisons or controls, measures against bias, and
    plans for data collection, analysis, and interpretation.
- id: ME4
  text: Feasibility strategy, anticipated problems, alternatives, and success criteria achievable within
    24 months.
- id: ME5
  text: Relevant biological variables such as sex and age in design and analysis, with justified restrictions,
    and inclusion across sex/gender, race, ethnicity and age where human participants are involved.
- id: ME6
  text: Explain the scientific use of personnel and resources, including relevant expertise, resource
    access and the status of planned arrangements.
- id: ME7
  text: All blood-pressure values collected as primary study data must be obtained with validated, automated
    devices using a documented measurement protocol that specifies cuff sizing, rest period, number of
    readings, and posture; self-reported blood-pressure values may be used only as a secondary or contextual
    variable, not as the primary outcome of a measurement-quality aim.
- id: ME8
  text: The application must describe a concrete community-engagement plan that includes at least one
    structured mechanism (e.g., community advisory board, participatory design sessions, or stakeholder
    working group) through which residents or frontline clinic staff from the target community contribute
    to study design, data interpretation, or product refinement during the award period; engagement activities
    must be distinguishable from data-collection procedures.

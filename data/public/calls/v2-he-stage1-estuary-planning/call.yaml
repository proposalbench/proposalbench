expected_outcomes:
- id: EO1
  text: Urban planning and water management authorities can use credible evidence on interacting estuarine
    flooding and urban drainage to choose spatial adaptation options under uncertain future conditions.
- id: EO2
  text: Authorities and affected communities can identify how adaptation options redistribute flood exposure,
    benefits and burdens across neighbourhoods and population groups, supporting decisions that address
    existing inequalities.
- id: EO3
  text: Residents, including groups poorly represented in planning processes, have an evidenced route
    to influence adaptation choices and understand the consequences for their neighbourhoods.
- id: EO4
  text: Authorities in other estuarine urban areas can judge which findings are transferable and under
    what physical, social and planning conditions.
scope:
- id: SC1
  text: Characterise interactions between estuarine water levels, river flows, rainfall and urban drainage
    under current and plausible future conditions, including coincident events and drainage constraints.
- id: SC2
  text: Establish physical evidence through observations or validated simulations, documenting fitness
    for the intended spatial decisions and limitations in representing relevant flood and drainage processes.
- id: SC3
  text: Compare spatial adaptation options against an explicit reference scenario, including land-use
    planning, water retention, nature-based measures or changes to drainage operation.
- id: SC4
  text: Translate physical evidence into spatially explicit estimates of residents’ exposure for each
    option, accounting for the location and use of housing, public space and essential services.
- id: SC5
  text: Assess how exposure changes, adaptation costs, access to benefits and potential displacement are
    distributed across population groups and neighbourhoods, including effects transferred beyond intervention
    areas.
- id: SC6
  text: Propagate uncertainty from physical processes, future development and social conditions through
    the comparison of options, identifying decisions that remain credible across plausible assumptions.
- id: SC7
  text: Co-design adaptation options and assessment priorities with residents, planning authorities and
    drainage managers, providing accessible ways for underrepresented groups to participate.
- id: SC8
  text: Compare findings across contrasting estuarine urban settings to identify transferable relationships
    and the contextual limits of applying them elsewhere.
exclusions:
- id: EX1
  text: Construction of permanent flood barriers; comparative assessment of such options and temporary
    monitoring installations remain within scope.
- id: EX2
  text: Routine drainage infrastructure renewal or expansion presented as the principal project activity.
- id: EX3
  text: Standalone flood forecasting or hazard mapping without an explicit connection to spatial planning
    choices and the distribution of residents’ exposure.
mandatory_elements:
- id: ME1
  text: Explain how the methodological concepts, models and assumptions enable the project objectives.
- id: ME2
  text: Address sex and gender analysis in the research content, or give a project-specific justification
    for its irrelevance.
- id: ME3
  text: Explain the open science practices used in the methodology, with project-specific reasons for
    any exceptions.
- id: ME4
  text: Explain the causal route by which the project results would deliver the stated topic outcomes
    for the target beneficiaries.
- id: ME5
  text: Explain how resident-level data linked to spatial exposure estimates will be protected against
    re-identification of individuals or households in published maps, datasets and other outputs.
- id: ME6
  text: Specify how disagreements among residents, planning authorities and drainage managers about adaptation
    options will be recorded and reflected in the comparison of options.

expected_outcomes:
- id: EO1
  text: Municipalities and water authorities deploy validated warning systems for storm-induced contamination
    events in receiving waters.
- id: EO2
  text: Urban planners and environmental agencies implement evidence-based decision-making frameworks
    to mitigate runoff pollution from urban and coastal catchments.
- id: EO3
  text: Citizens and local stakeholders are better informed about water quality risks.
- id: EO4
  text: Citizens and local stakeholders actively participate in the co-design of runoff mitigation strategies.
- id: EO5
  text: Reduced lag time between extreme precipitation events and the deployment of protection measures
    in affected waters, measured against a defined baseline and methodology.
scope:
- id: SC1
  text: Develop predictive models linking storm intensity, urban surface runoff, and contaminant transport
    to receiving waters, explicitly specifying and justifying the chosen spatial and temporal resolution.
- id: SC2
  text: Design and deploy sensor networks or integrate existing data streams to monitor runoff across
    urban and coastal catchments, explicitly defining the dimensions of pilot diversity.
- id: SC3
  text: Validate warning systems for contamination events in at least three pilot municipalities, specifying
    the target warning latency and the municipality-specific acceptance criteria to be met.
- id: SC4
  text: Create decision-support frameworks that enable municipal authorities to evaluate and select cost-effective
    runoff mitigation and public health protection measures.
- id: SC5
  text: Establish clear adoption routes for the developed tools, including guidelines for integration
    into existing municipal water management and emergency response protocols.
exclusions:
- id: EX1
  text: Proposals focusing solely on the structural redesign or physical upgrading of existing municipal
    wastewater treatment plants or combined sewer overflow infrastructure.
- id: EX2
  text: Research limited to the laboratory-scale analysis of novel contaminants without field validation
    in urban catchments.
mandatory_elements:
- id: ME1
  text: Open science practices, including FAIR research data management and open access to publications
    and, where possible, data and tools.
- id: ME2
  text: 'Multi-actor approach: Consortia must actively involve municipal authorities, water utilities,
    and environmental protection agencies in the co-design and validation of the warning systems.'
- id: ME3
  text: 'Social sciences and humanities (SSH) integration: Proposals must identify the specific SSH expertise
    included and its assigned role in the project.'
- id: ME4
  text: 'Citizen engagement and socio-economic analysis: Proposals must include specific activities for
    public risk communication and the analysis of socio-economic barriers to adopting new decision-support
    tools.'
- id: ME5
  text: 'Do No Significant Harm (DNSH): The methodology must include a proportionate DNSH assessment covering
    all proposed monitoring and mitigation activities, identifying environmental objectives, potential
    harms, and avoidance measures, especially for sensitive aquatic ecosystems.'

expected_outcomes:
- id: EO1
  text: District heating operators and urban planners have access to validated, replicable system designs
    that integrate seasonal or large-scale thermal energy storage (pit, tank, borehole or aquifer) with
    low-temperature district heating networks supplied by waste heat and renewable sources, demonstrated
    at no fewer than three climatically diverse pilot sites.
- id: EO2
  text: Network operators can deploy open, interoperable digital tools for predictive operational optimisation
    of storage charge–discharge cycles, demand forecasting and source scheduling, reducing annual thermal
    losses from storage by at least 15 % compared with rule-based control at the pilot sites.
- id: EO3
  text: Municipal authorities and regulators have evidence-based tariff frameworks and policy recommendations
    that ensure the economic benefits of thermal energy storage—lower marginal heat costs and improved
    supply security—are passed on to end-users, with specific mechanisms to protect energy-poor and low-income
    households from disproportionate cost burdens.
- id: EO4
  text: The European research and industry community benefits from publicly available, harmonised performance
    data and life-cycle assessments covering technical, economic, environmental and social dimensions
    of large-scale thermal storage integrated into district heating, enabling benchmarking across storage
    technologies and climatic zones.
scope:
- id: SC1
  text: Design, build or retrofit and operate at least three pilot-scale seasonal or large-scale thermal
    energy storage units (pit, tank, borehole field or aquifer) connected to low-temperature (≤ 55 °C
    supply) district heating networks in at least two EU Member States or Associated Countries.
- id: SC2
  text: Integrate at least two different waste or renewable heat sources per pilot site—such as solar
    thermal, industrial or commercial waste heat, geothermal, sewage heat recovery or surplus from combined
    heat and power—and characterise their temporal availability and quality.
- id: SC3
  text: Develop and validate model-predictive or data-driven operational optimisation strategies that
    jointly schedule storage charging and discharging, source dispatch and network flow, accounting for
    weather forecasts, demand profiles and electricity-market signals.
- id: SC4
  text: Conduct social-science research, including household surveys and participatory workshops, to design
    and test tariff structures and subsidy mechanisms that allocate storage-related cost savings equitably,
    with explicit provisions for energy-poor and low-income consumers.
- id: SC5
  text: Establish a common monitoring and reporting protocol across all pilot sites, collecting at least
    two full seasonal cycles of thermal, hydraulic, economic and user-satisfaction data, and publish the
    resulting datasets under open licences.
- id: SC6
  text: Perform comparative life-cycle assessment and life-cycle costing of the demonstrated storage–network
    configurations, including sensitivity analysis for different climatic zones, urban densities and regulatory
    contexts, to support replication planning.
exclusions:
- id: EX1
  text: Development or testing of novel heat-pump compressor hardware; proposals may use commercially
    available heat pumps as system components but must not focus on compressor-level innovation.
- id: EX2
  text: Thermal energy storage systems serving a single building or single building block; all storage
    units must be connected to a district-level heating network serving multiple buildings or a neighbourhood.
mandatory_elements:
- id: ME1
  text: Open science practices, including FAIR research data management and open access to publications
    and, where possible, data and tools.
- id: ME2
  text: Proposals must adopt a multi-actor approach, involving at least one district heating utility,
    one municipal or regional authority and one organisation representing low-income or energy-poor communities
    as consortium partners or through a formal collaboration agreement.
- id: ME3
  text: Proposals must integrate social sciences and humanities expertise to address tariff equity, energy
    poverty and user acceptance; at least one work package must be led by a partner with demonstrated
    competence in these disciplines.
- id: ME4
  text: Proposals must include a citizen and stakeholder engagement plan describing how residents—particularly
    those from low-income households—at each pilot site will be involved in co-designing tariff mechanisms
    and evaluating service quality throughout the project.
- id: ME5
  text: Proposals must include a do-no-significant-harm assessment in line with the EU Taxonomy Regulation,
    covering potential environmental impacts of underground storage (groundwater quality, land use, subsurface
    thermal pollution) and describing mitigation measures.

expected_outcomes:
- id: EO1
  text: Residents facing language and migration-related barriers have greater confidence and practical
    opportunities to deliberate about public services and contribute to decisions affecting their communities.
- id: EO2
  text: Participating organisations sustain deliberative practices that enable residents with different
    language skills and migration experiences to shape recommendations together.
- id: EO3
  text: Public authorities respond more transparently to residents’ recommendations, making proposed action,
    reasons for non-adoption and opportunities for follow-up visible to participants.
- id: EO4
  text: Residents’ experience informs dialogue on EU policies concerning inclusion and access to services,
    supported by learning across participating countries.
scope:
- id: SC1
  text: Work with affected residents to identify public-service access problems suitable for collective
    deliberation.
- id: SC2
  text: Recruit residents through trusted community channels, such as community organisations, language
    courses, faith groups and local service points.
- id: SC3
  text: Convene accessible assemblies using interpretation, translated materials and facilitation adapted
    to participants’ language and communication needs.
- id: SC4
  text: Support residents to develop recommendations through informed discussion of different experiences,
    options and trade-offs.
- id: SC5
  text: Organise exchanges with responsible public authorities to present recommendations and obtain documented
    responses.
- id: SC6
  text: Return authorities’ responses to participants in accessible formats and provide opportunities
    to discuss subsequent action.
- id: SC7
  text: Bring residents from participating countries into dialogue with actors involved in EU policymaking
    on inclusion and access to services.
exclusions:
- id: EX1
  text: Financial support to third parties is not permitted.
- id: EX2
  text: Purely academic research without direct citizen engagement is outside this fictional topic.
- id: EX3
  text: Activities supporting a specific European Citizens’ Initiative are excluded.
- id: EX4
  text: Activities rallying support for a single cause are excluded.
- id: EX5
  text: Individual migration-status casework, including advice or representation in residence or asylum
    proceedings, is excluded; projects may refer participants to existing advice services.
mandatory_elements:
- id: ME1
  text: Describe the participatory activities that constitute each event/work package.
- id: ME2
  text: State the planned number of direct participants for each event, using the counting rules below.
- id: ME3
  text: Identify the eligible countries represented in each event and give their number, using the counting
    convention below.
- id: ME4
  text: State the share of the total requested EU grant assigned to each work package.
- id: ME5
  text: Describe how the target participants can access the planned participation activities.
- id: ME6
  text: Explain how the participation design addresses gender-related barriers.
- id: ME7
  text: Explain how citizens’ contributions influence the deliberation and subsequent policy engagement.
- id: ME8
  text: Where applicable, describe how personal data collected through the participation activities will
    be protected.
- id: ME9
  text: Include, for each event/work package, a report on its implementation (the programme's event description
    sheet) as a deliverable.
- id: ME10
  text: Include a project milestone for asking event attendees to take part in the EU Survey on Justice,
    Rights and Values once the granting authority provides the link.
- id: ME11
  text: State the target share of assembly places for residents not connected to established community
    organisations, the outreach used to reach them, and how attainment will be checked during recruitment.
- id: ME12
  text: Distinguish the responsibilities of resident participants, community intermediaries, facilitators
    and public-authority representatives within the assemblies.
- id: ME13
  text: Describe safeguards enabling residents to discuss service barriers without pressure to disclose
    migration status or personal experiences of harm.
- id: ME14
  text: Specify how recommendations and authorities’ responses will be tracked, including responsibility
    for seeking responses where none are received.
- id: ME15
  text: Explain how recommendations produced in different countries and languages will be compiled for
    EU-level dialogue while each remains traceable to the assembly that produced it.
- id: ME16
  text: Set out how evaluation will assess changes in residents’ ability to participate and the uptake
    of recommendations, using baseline evidence and participant feedback.

facts:
- id: F01
  category: grant
  kind: existing
  text: The RatioWeave-Tutor study was funded by the Spencer Foundation (research grant PB-SP-MTE-2020-01),
    not by the National Science Foundation.
  value: Spencer Foundation
  salient: true
  source: prior_project.md
- id: F02
  category: grant
  kind: existing
  text: The Spencer Foundation grant totalled $748,000 for the period 1 August 2020 to 31 July 2024 and
    covered only the research and evaluation, not the tutoring programme itself.
  value: $748,000
  salient: true
  source: prior_project.md
- id: F03
  category: result
  kind: existing
  text: The primary ITT effect on the state math assessment after two years was 0.21 SD (Hedges' g = 0.21,
    95% CI [0.09, 0.33]).
  value: 0.21 SD
  salient: true
  source: prior_project.md
- id: F04
  category: result
  kind: existing
  text: The 95% confidence interval for the primary effect size was [0.09, 0.33].
  value: '[0.09, 0.33]'
  salient: true
  source: prior_project.md
- id: F05
  category: result
  kind: existing
  text: The effect on the algebraic reasoning assessment was 0.28 SD (95% CI [0.14, 0.42]).
  value: 0.28 SD
  salient: true
  source: prior_project.md
- id: F06
  category: result
  kind: existing
  text: The effect on mathematics self-efficacy was 0.13 SD (95% CI [0.01, 0.25]).
  value: 0.13 SD
  salient: true
  source: prior_project.md
- id: F07
  category: result
  kind: existing
  text: The analytic sample comprised 4,217 students (2,118 treatment, 2,099 control) across 38 schools
    after 6.9% attrition from an original enrolled sample of 4,530.
  value: 4,217
  salient: true
  source: prior_project.md
- id: F08
  category: result
  kind: existing
  text: Students in the bottom quartile of baseline math scores showed an effect of 0.34 SD (95% CI [0.16,
    0.52]).
  value: 0.34 SD
  salient: true
  source: prior_project.md
- id: F09
  category: result
  kind: existing
  text: Median tutoring attendance rate among treatment students was 87% of scheduled sessions.
  value: 87%
  salient: true
  source: prior_project.md
- id: F10
  category: result
  kind: existing
  text: The per-student cost of the RatioWeave-Tutor programme was $3,400 per year, funded by CQMSD (not
    the Spencer grant).
  value: $3,400 per year
  salient: true
  source: prior_project.md
- id: F11
  category: result
  kind: existing
  text: 48 tutors were interviewed; 31 of 48 (65%) felt the scripted curriculum limited responsive teaching.
  value: 65%
  salient: true
  source: prior_project.md
- id: F12
  category: result
  kind: existing
  text: 38 of 48 tutors (79%) reported meeting with the student's regular math teacher fewer than twice
    per semester.
  value: 79%
  salient: true
  source: prior_project.md
- id: F13
  category: other
  kind: existing
  text: The study did not incorporate any technology-based or AI-assisted tutoring tools; all instruction
    was face-to-face by human tutors.
  value: null
  salient: true
  source: prior_project.md
- id: F14
  category: team
  kind: existing
  text: Neither the PI nor the Co-PI has expertise in computer science, artificial intelligence, or machine
    learning.
  value: null
  salient: true
  source: team_resources.md
- id: F15
  category: team
  kind: existing
  text: The team has no existing collaborations with computer science or engineering departments.
  value: null
  salient: true
  source: team_resources.md

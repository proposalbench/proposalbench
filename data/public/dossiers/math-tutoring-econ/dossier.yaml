  value: August 2027
  salient: true
  source: team_resources.md
- id: F21
  category: partner
  kind: existing
  text: CQMSD serves approximately 47,000 students across 78 schools; 81% qualify for free or reduced-price
    lunch; 49% Black, 29% Hispanic, 13% White, 9% other.
  value: 47,000
  salient: true
  source: team_resources.md
- id: F22
  category: result
  kind: existing
  text: The analytic sample was 83% eligible for free or reduced-price lunch; 47% Black, 31% Hispanic,
    12% White, 10% other.
  value: 83%
  salient: true
  source: prior_project.md
- id: F23
  category: result
  kind: existing
  text: Inter-rater reliability for qualitative coding was Cohen's κ = 0.81.
  value: '0.81'
  salient: false
  source: prior_project.md
- id: F24
  category: result
  kind: existing
  text: Effect for English learners on the state math assessment was 0.24 SD (95% CI [0.06, 0.42]).
  value: 0.24 SD
  salient: true
  source: prior_project.md
- id: F25
  category: result
  kind: existing
  text: The RatioWeave-Tutor tutoring model used small groups of 3 students per tutor.
  value: 3 students per tutor
  salient: true
  source: prior_project.md
- id: F26
  category: result
  kind: existing
  text: Tutors received 80 hours of initial training plus weekly coaching from a district mathematics
    coach.
  value: 80 hours
  salient: true
  source: prior_project.md
- id: F27
  category: result
  kind: existing
  text: In an exploratory (non-randomised) comparison, the 1,614 treatment students attending at least
    80% of sessions showed an adjusted difference of 0.27 SD (95% CI [0.13, 0.41]) on the state assessment;
    attendance was not randomised and this does not identify a causal effect.
  value: 0.27 SD
  salient: true
  source: prior_project.md
- id: F28
  category: other
  kind: existing
  text: 'Limitation: the study was conducted in a single urban district; generalisability to suburban
    or rural settings is unknown.'
  value: null
  salient: true
  source: prior_project.md
- id: F29
  category: other
  kind: existing
  text: 'Limitation: the control condition was business-as-usual instruction; the study cannot isolate
    which components of the tutoring model drove the effects.'
  value: null
  salient: true
  source: prior_project.md
- id: F30
  category: other
  kind: existing
  text: 'Limitation: outcomes were measured only through the end of the two-year treatment period; longer-term
    persistence of effects is unknown.'
  value: null
  salient: true

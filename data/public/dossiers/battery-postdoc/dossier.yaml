  value: EUR 84,000
  salient: true
  source: prior_project.md
- id: F10
  category: result
  kind: existing
  text: SULVERNEX used six independent electrolyte synthesis batches supplying 18 conductivity pellets
    and 24 cycling cells, with 12 cycling cells per cathode condition and all cells completing the protocol.
  value: 24 cells
  salient: true
  source: prior_project.md
- id: F11
  category: result
  kind: existing
  text: Li6PS5Cl conductivity at 25 °C was 3.1 ± 0.4 mS cm−1, expressed as the mean and sample standard
    deviation of six batch means from three pellets each.
  value: 3.1 ± 0.4 mS cm−1
  salient: true
  source: prior_project.md
- id: F12
  category: result
  kind: existing
  text: Cycle-5 discharge capacity was 154 ± 9 mAh g−1 for coated cathodes and 157 ± 10 mAh g−1 for uncoated
    cathodes, with sample standard deviations across 12 cells per condition.
  value: 154 ± 9 mAh g−1
  salient: true
  source: prior_project.md
- id: F13
  category: result
  kind: existing
  text: Cycle-100 retention relative to cycle 5 was 84.6 ± 4.3% for coated cathodes and 69.8 ± 6.1% for
    uncoated cathodes, a difference of 14.8 percentage points with a batch-resampled 95% confidence interval
    of 9.6–20.0 percentage points.
  value: 84.6 ± 4.3%
  salient: true
  source: prior_project.md
- id: F14
  category: result
  kind: existing
  text: Fitted non-ohmic area-specific resistance rose from 38 ± 7 to 92 ± 18 Ω cm² for coated cathodes
    and from 41 ± 8 to 176 ± 31 Ω cm² for uncoated cathodes between cycles 5 and 100, with sample standard
    deviations across 12 cells per condition.
  value: 92 ± 18 Ω cm²
  salient: true
  source: prior_project.md
- id: F15
  category: result
  kind: existing
  text: Mean resistance growth was 54 Ω cm² versus 135 Ω cm², giving 60.0% less growth for coated cathodes
    and an absolute contrast of 81 Ω cm² with a batch-resampled 95% confidence interval of 58–104 Ω cm².
  value: 60.0%
  salient: true
  source: prior_project.md
- id: F16
  category: other
  kind: existing
  text: The lithium–indium pellet cells used 2.0 ± 0.2 mg cm−2 active-material loading and 500 ± 40 µm
    separators and were cycled at 25 °C, 10 MPa, 2.2–3.6 V and 18 mA g−1, equivalent to C/10 on a 180
    mAh g−1 basis.
  value: 10 MPa
  salient: true
  source: prior_project.md
- id: F17
  category: other
  kind: existing
  text: SULVERNEX used one cathode lot and one coating preparation, lacked operando evidence and practical-format
    validation, and could not uniquely attribute measured resistance growth to a chemically isolated cathode
    interphase.
  value: null
  salient: true
  source: prior_project.md

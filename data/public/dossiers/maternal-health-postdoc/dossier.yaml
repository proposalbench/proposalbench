- id: F05
  category: result
  kind: existing
  text: NEVRAMAT trial enrolled 2,150 women across 12 CHPS zones in Bono East Region over 15 months; 1,214
    were screened in intervention periods and 936 received standard care in control periods.
  value: 2,150
  salient: true
  source: prior_project.md
- id: F06
  category: result
  kind: existing
  text: 327 of 1,214 screened women (26.9%) were classified as high-risk by CHWs in intervention periods.
  value: 26.9%
  salient: true
  source: prior_project.md
- id: F07
  category: result
  kind: existing
  text: Referral completion among high-risk women increased from 37.5% (control) to 75.8% (intervention),
    an adjusted increase of 34.2 percentage points (95% CI 25.8–42.6 pp).
  value: 34.2 percentage points
  salient: true
  source: prior_project.md
- id: F08
  category: result
  kind: existing
  text: There were 588 paired CHW/physician assessments; the archived summary does not document selection
    of this subset or the reference-standard cross-tabulation, so population sensitivity and specificity
    cannot be established from these materials.
  value: '588'
  salient: true
  source: prior_project.md
- id: F09
  category: result
  kind: existing
  text: Among facility deliveries, PPH was observed in 41/494 (8.3%) intervention-period deliveries and
    38/325 (11.7%) control-period deliveries; adjusted OR 0.68 (95% CI 0.42–1.10; p=0.12). The archived
    summary does not stratify by whether initial enrolment preceded delivery; these are descriptive facility-period
    rates.
  value: '0.68'
  salient: true
  source: prior_project.md
- id: F10
  category: result
  kind: existing
  text: Qualitative component comprised 42 in-depth interviews (24 women, 18 CHWs) and 6 focus group discussions
    (48 participants total).
  value: '42'
  salient: true
  source: prior_project.md
- id: F11
  category: result
  kind: existing
  text: CHW attrition during the NEVRAMAT trial was 11% (4 of 36 CHWs).
  value: 11%
  salient: false
  source: prior_project.md

facts:
- id: F01
  category: result
  kind: existing
  text: The LAPSES study recruited a baseline cohort of 412 adolescents (ages 12-14, 52% female).
  value: '412'
  salient: true
  source: prior_project.md
- id: F02
  category: result
  kind: existing
  text: Wave 3 retained 346 participants, an 84% retention rate.
  value: 84%
  salient: true
  source: prior_project.md
- id: F03
  category: result
  kind: existing
  text: The study yielded 1,139 usable participant-waves.
  value: 1,139
  salient: true
  source: prior_project.md
- id: F04
  category: result
  kind: existing
  text: The project collected a total of 13,415 valid nights of actigraphy across three waves.
  value: 13,415
  salient: true
  source: prior_project.md
- id: F05
  category: result
  kind: existing
  text: Participants averaged 11.8 valid nights of actigraphy per completed wave.
  value: '11.8'
  salient: true
  source: prior_project.md
- id: F06
  category: result
  kind: existing
  text: A valid night required >10 hours of wear time per 24-hour period, regardless of whether the principal
    sleep interval was fully captured.
  value: '>10 hours'
  salient: true
  source: prior_project.md
- id: F07
  category: result
  kind: existing
  text: Missing epoch pairs were simply excluded from the SRI denominator, subjecting regularity estimates
    to selective coverage biases.
  value: null
  salient: true
  source: prior_project.md
- id: F08
  category: result
  kind: existing
  text: The 11.8-night yield overestimates the true 24-hour continuous coverage.
  value: '11.8'
  salient: true
  source: prior_project.md
- id: F09
  category: result
  kind: existing
  text: Average objective sleep duration declined by 22 minutes per year (95% CI 18-26 minutes).
  value: '22'
  salient: true
  source: prior_project.md
- id: F10
  category: result
  kind: existing
  text: SRI showed a significant linear decrease of 3.1 points per year (95% CI 2.2-4.0).
  value: '3.1'
  salient: true
  source: prior_project.md
- id: F11
  category: result
  kind: existing
  text: A 10-point decrease in SRI was associated with a 2.4-point increase in PHQ-9 scores (95% CI 1.1-3.7),
    independent of total sleep duration.
  value: '2.4'
  salient: true
  source: prior_project.md
- id: F12
  category: result
  kind: existing
  text: In a baseline cross-sectional analysis, short sleep duration (<7 hours, n = 85) was associated
    with a +0.42 higher BMI z-score (95% CI 0.15-0.69) compared to >8 hours (n = 142).
  value: '+0.42'
  salient: true
  source: prior_project.md
- id: F13
  category: result
  kind: existing
  text: In longitudinal mixed-effects analyses, lower SRI was independently associated with higher BMI
    z-scores over time (+0.18 per 10-point SRI decrease, 95% CI 0.05-0.31).
  value: '+0.18'
  salient: true
  source: prior_project.md
- id: F14
  category: result
  kind: existing
  text: Because data collection followed a single cohort across three calendar years, developmental and
    calendar-period effects cannot be cleanly separated.
  value: null
  salient: true
  source: prior_project.md
- id: F15
  category: result
  kind: existing
  text: The existing LAPSES cohort data contains no blood pressure or metabolic measurements.
  value: null
  salient: true
  source: prior_project.md
- id: F16
  category: grant
  kind: existing
  text: The NIH K01 grant provided $685,000 in direct costs from 07/01/2021 to 06/30/2026.
  value: $685,000
  salient: true
  source: cv_pi.md
- id: F17
  category: grant
  kind: existing
  text: The Oakhaven University Seed Grant provided $45,000 in direct costs from 09/01/2019 to 08/31/2021.
  value: $45,000
  salient: true
  source: cv_pi.md

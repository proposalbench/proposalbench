reviewer_criticisms:
- id: R1
  text: The reliability of the mobile attention task in this specific clinical population is untested.
- id: R2
  text: The study fails to measure and account for potential confounding by medication characteristics
    and baseline severity.
- id: R3
  text: Recruitment from one clinic lacked a feasible retention plan.
- id: R4
  text: The causal language used throughout the proposal exceeded what can be inferred from an observational
    design.

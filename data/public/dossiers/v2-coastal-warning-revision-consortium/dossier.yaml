reviewer_criticisms:
- id: R1
  text: The faecal-contamination (E. coli exceedance) proxy was calibrated only on Corrib estuary samples,
    and its coefficients were to be applied unchanged at the Charente sites with just 30 verification
    samples in a single season, so transferability was assumed rather than tested and no contingency was
    foreseen if that season brought too few heavy-rainfall events.
- id: R2
  text: Warning thresholds were fixed at a predicted exceedance probability of 0.5 without saying who
    acts on a warning or how false-alarm and missed-event costs set the threshold, so no user decision
    rule was given.
- id: R3
  text: The headline impact of about 3,400 avoided bather exposures per season was a single value with
    no uncertainty from proxy misclassification, travel times or beach attendance.
- id: R4
  text: The dissemination plan promised to publish all data, including overflow telemetry, licensed radar
    inputs and survey data, under CC BY 4.0 although the proposal itself stated these were held under
    data-sharing agreements and commercial licences, and beyond preregistration and a month-6 data management
    plan the open-science and data-management approach was described only in general terms.
- id: R5
  text: The target of replication at 20 sites by 2030 was not substantiated, and no end-user organisation
    had committed to the project.

facts:
- id: F01
  category: result
  kind: existing
  text: Proxy sensitivity for E. coli exceedance was 0.76 (19 of 25; bootstrap 95% CI 0.55-0.90) from
    out-of-fold predictions, estimated in the Corrib estuary only and still preliminary.
  value: '0.76'
  salient: true
  source: bayproxy_final_report.md
- id: F02
  category: result
  kind: existing
  text: Proxy specificity was 0.88 (103 of 117; 95% CI 0.81-0.93).
  value: '0.88'
  salient: true
  source: bayproxy_final_report.md
- id: F03
  category: result
  kind: existing
  text: BAYPROXY analysed 142 paired proxy-culture samples (81 routine, 61 event, after excluding 8 of
    150) from nine stations in one estuary; 25 (17.6%) were exceedances, 21 of them in event samples.
  value: '142'
  salient: true
  source: bayproxy_final_report.md
- id: F04
  category: result
  kind: existing
  text: The reference endpoint is culture-based E. coli by ISO 9308-3 with exceedance defined as a single
    sample above 500 MPN/100 mL; no pathogens such as norovirus were measured.
  value: 500 MPN/100 mL
  salient: true
  source: bayproxy_final_report.md
- id: F05
  category: result
  kind: existing
  text: A retrospective zero-lead hindcast (leave-one-year-out, observed rainfall and spill telemetry)
    gave AUC 0.81 (95% CI 0.74-0.87) over 486 sample-days with 38 exceedances; skill at forecast lead
    times was not tested.
  value: '0.81'
  salient: true
  source: bayproxy_final_report.md
- id: F06
  category: result
  kind: existing
  text: Of 612 surveyed beach users, 23% relied only on on-site signs, 31% swam outside the bathing season
    and 57% had entered the water on the day of interview.
  value: 23%
  salient: true
  source: bayproxy_final_report.md
- id: F07
  category: grant
  kind: existing
  text: BAYPROXY was funded by the EPA Research Programme 2021-2030 (2021-W-MS-47), 2021-2024, with the
    coordinator as PI.
  value: EUR 398,000
  salient: true
  source: bayproxy_final_report.md
- id: F08
  category: grant
  kind: existing
  text: The unfunded OUTFALERT Horizon Europe RIA was submitted on 16 September 2025 for 36 months and
    EUR 3,000,000, with 354 person-months (CICS 168, URC 102, WISW 84).
  value: EUR 3,000,000
  salient: true
  source: outfalert_application_2025_abridged.md
- id: F09
  category: other
  kind: existing
  text: The ESR notified on 10 February 2026 scored the proposal 10.50 (Excellence 3.50, Impact 3.00,
    Implementation 4.00); it was above threshold but below the funding line.
  value: '10.50'
  salient: true
  source: outfalert_esr_2026.md
- id: F10
  category: result
  kind: existing
  text: Apart from a pilot of 6 paired Charente samples (22 July-28 August 2026, one exceedance), no sampling
    under the two-estuary protocol has started; the pilot gives no usable sensitivity or specificity estimate
    and cross-estuary validation has not been done.
  value: '6'
  salient: true
  source: technical_update_sept2026.md
- id: F11
  category: resource
  kind: existing
  text: Protocol OUTFALERT-CAL-2E v1.0 (approved 30 June 2026) accepts coefficients transferred between
    estuaries only if, in the receiving estuary, the lower 95% bound for sensitivity is at least 0.60
    and specificity is at least 0.80; it has no rule for an estuary with fewer than 40 exceedances.
  value: '0.60'
  salient: true
  source: technical_update_sept2026.md
- id: F12
  category: resource
  kind: planned
  text: The protocol's sampling campaign targets 115 paired samples per estuary with at least 40 exceedances
    over two bathing seasons (expected sensitivity CI half-width about 0.13); it is unfunded.
  value: '115'
  salient: true
  source: technical_update_sept2026.md
- id: F13
  category: result
  kind: existing
  text: WISW's draft decision-cost table v0.2 (31 July 2026) implies warning thresholds of 0.05-0.33,
    central 0.14, which on the hindcast would have warned 32 of 38 exceedances with a false alarm ratio
    of 0.48; no authority has reviewed it or agreed to own a decision rule.
  value: '0.14'
  salient: true
  source: technical_update_sept2026.md
- id: F14
  category: result
  kind: existing
  text: outfalert-uq v0.3 (15 June 2026) gives a conditional upper-bound estimate of 2,580 potentially
    avoidable exposures per season (95% interval 1,610-3,390) under full-reach and full-compliance assumptions,
    Corrib only; the code is not public and the manuscript submitted 20 August 2026 is under review.
  value: 2,580
  salient: true
  source: technical_update_sept2026.md
- id: F15
  category: resource
  kind: existing
  text: 'Data inventory v1.1 (29 September 2026) lists 14 data assets: 5 restricted raw, 2 unrestricted
    raw not yet deposited (Charente pilot and Shannon split samples), 5 shareable derived and 2 already
    open.'
  value: '14'
  salient: true
  source: technical_update_sept2026.md
- id: F16
  category: resource
  kind: existing
  text: Overflow telemetry is shared under an agreement running to 31 December 2027 that bars redistribution
    of raw or event-level records; radar nowcasts are licensed for internal use only, survey consent allows
    aggregated release only, and Charente overflow logs and attendance data are restricted.
  value: 31 December 2027
  salient: true
  source: technical_update_sept2026.md

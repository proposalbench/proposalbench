reviewer_criticisms:
- id: R1
  text: Validation withholds time steps from storms already used to select parameters and preprocessing,
    without an untouched event allocation, protection against test-set tuning or a gate establishing independent
    warning skill.
- id: R2
  text: The municipal adoption route lacks a responsible operational owner and an approved decision threshold
    connecting a forecast to an authorised action.
- id: R3
  text: The equity objective relies on municipal officers to represent underserved residents, with no
    direct co-design participation, recruitment pathway or resources addressing participation barriers.
- id: R4
  text: The schedule and budget omit owners, durations and identifiable costs for critical data, permission,
    modelling-interface and deployment handovers.
- id: R5
  text: The proposed coupling to receiving-water transport lacks a sufficiently clear account of how uncertainty
    propagates through the coupled components within validation.

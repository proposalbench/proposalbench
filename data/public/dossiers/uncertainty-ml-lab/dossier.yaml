- id: F08
  category: result
  kind: existing
  text: 'In the user study (n = 64 adults), participants in the Calibrated condition correctly rejected
    incorrect feedback at 61% (95% CI: 53%–69%) vs. 38% (95% CI: 30%–46%) in Control (t(62) = 3.98, p
    < 0.001).'
  value: 61%
  salient: true
  source: prior_project.md
- id: F09
  category: result
  kind: existing
  text: Revision quality was higher in the Calibrated condition (M = 4.12, SD = 0.91) than Control (M
    = 3.54, SD = 1.03), Cohen's d = 0.60.
  value: '0.60'
  salient: true
  source: prior_project.md

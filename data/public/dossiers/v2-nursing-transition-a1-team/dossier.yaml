reviewer_criticisms:
- id: R1
  text: Medication adherence was measured only by self-report (a days 1-7 diary and a single week-6 recall)
    with no objective check such as electronic event monitoring, and the pilot showed a ceiling with 21
    of 26 reporting no missed doses.
- id: R2
  text: Stress and attention were measured only in a seven-day burst after discharge, so the design could
    not capture how these exposures vary across the six-week transition.
- id: R3
  text: Attrition was handled by multiple imputation under missing at random despite pilot non-completers
    having higher baseline stress, with no missing-not-at-random sensitivity analysis such as pattern-mixture
    or tipping-point models, and statistical support was only 3% shared-core effort without a named statistician.
- id: R4
  text: Half of the 90 participants were to come from Lakevale Community Health Center without a letter
    of support, leaving second-site recruitment feasibility undocumented.
- id: R5
  text: Aim 3 was framed as identifying a mechanism, although an observational design measuring stress
    and attention in week 1 and adherence at week 6 cannot establish temporal ordering or causal mediation,
    so the aim needed a bounded descriptive interpretation.

[project]
name = "proposalbench"
version = "0.1.0.dev0"
description = "Open benchmark for call-conditioned research proposal writing"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "LICENSE-DATA"]
requires-python = ">=3.11"
authors = [{ name = "ProposalBench maintainers" }]
classifiers = [
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "pydantic>=2.7",
  "pyyaml>=6.0",
  "typer>=0.12",
  "httpx>=0.27",
  "rapidfuzz>=3.6",
  "markdown-it-py>=3.0",
  "numpy>=1.26",
  "python-dotenv>=1.0",
  "lingua-language-detector>=2.0",
  "openai>=3.41.0",
  "google-genai>=2.34.0",
  "boto3>=1.43.122",
]

[project.scripts]
pb = "proposalbench.cli:app"

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/proposalbench"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]  # en-dashes and typographic quotes are legitimate in proposal text

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["network: test needs live network access (skipped by default in CI)"]

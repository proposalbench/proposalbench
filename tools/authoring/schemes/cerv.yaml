  in-person events, EU-official exclusion and duplicate-count rules. Residence-based country
  counts, attendance evidence and delivery-role treatment are explicit benchmark conventions.
  Ask for planning grant shares, not unavailable official tariff amounts. Keep consortium
  eligibility in prose/notes; topic items must not contradict or silently narrow it.
  eligibility_bounds:
    max_budget: {min: 300000, max: 300000}
    duration_months_max: {min: 24, max: 24}
  Use only CITIZENS-CIV sub-priority 2.1; do not mix eligibility with national electoral bodies (1.2) or local-authority-led 2.2. Generic Part B V3.0 (15 January 2025) supplies narrative section ids; its administrative section 6 is deliberately outside the deliverable. Call section 5 overrides the generic 45-page ceiling with 70. EUR 300k maximum, strict 12–24 month range without extension, and topic research exclusion are fictional restrictions. No event-tariff arithmetic is encoded: the official calculator requires per-event eligible direct participants/countries; preserve those narrative inputs and never invent tariff values. Rules on sanctions/excluded entities remain subject to the official call; use unambiguously eligible fictional EU organisations in dossiers.
  Preserve all fixed items and section ids. Topic slots contain merged fixed and topic items,
  using unused EO/SC/EX/ME ids. Each item must be a single narrative-visible requirement.
  Put eligibility and submission rules in eligibility prose and consortium notes, not MEs.
  Use the stated fictional deadline 15 September 2027 where a deadline is needed; do not imply

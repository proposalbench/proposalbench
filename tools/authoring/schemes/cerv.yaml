call_md: |
  # {{title}} — {{topic_code}}

  > Fictional ProposalBench action-grant topic modelled on CERV-2026-CITIZENS-CIV, sub-priority 2.1 (civil society organisations). This is not an open EU call; topic details, deadline and upper grant cap are invented.

  ## Purpose and eligibility

  Support citizens' participation in democratic life through civil-society-led participatory and deliberative processes. The eligible-country basis is EU Member States (including OCTs) and countries associated to CERV; a country negotiating association must have an agreement in force before signature. Activities take place in eligible countries. The official minimum grant is EUR 75,000 and the official call sets no maximum; this fictional topic adds the ceiling in the table below. Use at least 12 months, up to the maximum duration in that table, without an extension in this benchmark. The lead may submit only one application across the official call's priorities; the benchmark uses one application. At least two applicants must be beneficiaries from two different CERV-eligible countries; affiliated entities and associated partners do not count towards this minimum. The coordinator must be a private nonprofit legal entity or a public university; co-applicants must be nonprofit public or private legal entities or international organisations. The fictional deadline is 15 September 2027.

  {{header_table}}

  ## Expected outcomes

  {{expected_outcomes_intro}}

  {{expected_outcomes}}

  ## Scope

  {{scope_intro}}

  {{scope}}

  ## Exclusions

  {{exclusions}}

  ## Specific conditions and mandatory elements

  {{specific_conditions}}

  ## Required narrative

  ### 1. Relevance
  Use the following three subsections to establish relevance to sub-priority 2.1.

  #### 1.1. Background and general objectives
  Explain the EU policy context, democratic problem and general objective.

  #### 1.2. Needs analysis and specific objectives
  Present evidence of needs, the target population, gender/access barriers and specific objectives.

  #### 1.3. Complementarity with other actions and innovation — European added value
  Explain why cross-country cooperation is needed and how results complement existing efforts.

  ### 2. Quality
  Use the following subsections for delivery quality.

  #### 2.1. Concept and methodology
  Describe participatory methods and the chain from needs through activities to outcomes.

  #### 2.2. Consortium set-up
  Justify the eligible partners and their complementary contributions.

  #### 2.3. Project teams, staff and experts
  Assign staff roles according to the expertise required for the activities.

  #### 2.4. Consortium management and decision-making
  Explain coordination, decisions and handling disagreements.

  #### 2.5. Project management, quality assurance and monitoring and evaluation strategy
  Specify monitoring, evidence of participation, evaluation and corrective action.

  #### 2.6. Cost effectiveness and financial management
  State the total requested EU grant and the share assigned to each work package, with a rationale for the distribution. These narrative shares are planning allocations, not tariff calculations (benchmark convention). The official event-based calculation belongs in Part A; no tariff values or tariff-derived amounts are requested here.

  #### 2.7. Risk management
  Identify concrete delivery and participation risks, triggers and mitigations.

  ### 3. Impact
  Use the following subsections for the expected difference and its continuation.

  #### 3.1. Impact and ambition
  Explain the intended effects on citizens, organisations and democratic participation.

  #### 3.2. Communication, dissemination and visibility
  Match channels to audiences, acknowledge EU funding and enable external use.

  #### 3.3. Sustainability and continuation
  Identify who sustains results and the resources or decisions needed after funding.

  ### 4. Workplan, work packages, activities, resources and timing
  Provide the work plan and event-level detail.

  #### 4.1. Work plan
  Show the schedule and dependencies.

  #### 4.2. Work packages, activities, resources and timing
  For each event/work package list activities, responsible beneficiaries, timing, deliverables, planned direct participants, eligible countries represented and its share of the requested grant. The shares must sum to the total request. Two components are mandatory for every project (call document, section 10): a report on the implementation of each event/work package (event description sheet) as a deliverable, and a milestone for asking event attendees to take part in the EU Survey on Justice, Rights and Values once the granting authority provides the link. Each work package is an event gathering citizens or stakeholders within a defined time frame towards an output; it may combine several activities and may take place in person or online.

  Direct participants are citizens or stakeholders from the target groups who actively take part and whose participation is verifiable. EU officials do not count. Count each person once per event, even across several activities. When activities in different work packages share participants and overlap or occur on the same or consecutive days, count those participants under only one work package (call document, section 10, pp. 28–29).

  For the narrative counts, use the following benchmark convention: count eligible countries by the residence of counted participants, irrespective of nationality or age. Record participation through attendance lists or online participation logs. Staff, facilitators, interpreters and speakers count only if they also actively participate as members of a target group, rather than solely delivering the event; passive audiences do not count. These residence, evidence and role conventions supplement the call document’s active-and-verifiable-participation rule; they are not official tariff rules.

  ### 5. Other
  Address the following conditions proportionately.

  #### 5.1. Ethics and EU values
  Explain consent, data minimisation, participant protection, non-discrimination and EU values. Include child safeguarding if children take part.

  #### 5.2. Security
  Identify security issues if relevant; otherwise state that none are identified. Administrative declarations, Part A, staff-effort tables marked not applicable to lump sums, and annex uploads are outside this deliverable.

  ## Award criteria

  Relevance: 40 points (minimum 25); Quality: 40; Impact: 20. At least 70/100 overall and the Relevance threshold are required; no separate Quality or Impact minimum is specified. Relevance assesses needs, EU policy fit and transnational added value; Quality assesses coherent methods, delivery, monitoring, ethics and EU values; Impact assesses plausible longer-term effects, dissemination and sustainability. These are the selected call's criteria, not a universal CERV rule.

  ## Length contract

  The selected 2026 call permits 70 Part B pages, overriding the generic CERV form's normal 45. At a practical 500 words/page, the benchmark ceiling is {{max_words}} words. References, tables and captions count; only the title is exempt by benchmark convention. Excess is disregarded with zero tolerance. The form permits Arial 9 point on A4 with 15 mm margins; 500 words/page is a conservative prose estimate, not a literal reconstruction of its instruction-heavy pages.

  ## Sources

  Verified 2026-10-31; policy paraphrases, not an official funding notice.

author_notes: |
  La lista fija selecciona ocho exigencias narrativas evaluables; los demás detalles de la
  memoria siguen en sus apartados. Las antiguas EO/SC genéricas se sustituyen por resultados
  y ámbito propios del tema. La prioridad debe ser la nombrada por el autor de la convocatoria.
  La vinculación de IP, RTA, formato coordinado y duraciones se tratan en elegibilidad.
  La precisión operativa de la antigua EX2 se etiqueta como convención: el anexo VII, p. 75,
  solo contiene la prohibición general, sin delimitar la observación de entidades externas.
  La separación presupuestaria se verifica en artículos 11, 13 y 14.2–3; la exclusión expresa
  de la ayuda predoctoral del umbral de inglés no figura en 18.2.a y se etiqueta como convención.

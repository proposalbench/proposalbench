# Horizon Europe Research and Innovation Action (RIA), full proposal, Part B.
# Sources: Horizon Europe General Annexes 2026-2027 (page limit, award criteria, thresholds);
# standard application form (HE RIA/IA) Part B template. Same rules as the pilot call
# data/pilot/calls/he-cl6-soilwater, which was checked on 2026-10-30.
name: horizon_ria
scheme: horizon_ria
language: en
topic_code_prefix: PB-HE
bottom_up: false
render_fixed_conditions: true

length_contract:
  max_words: 18000
  enforcement: disregard_excess
  tolerance: 0.0
  counted_sections: ["1", "2", "3"]
  exempt: [references, title]
  page_limit: 40
  words_per_page: 450
  source_note: >-
    Horizon Europe General Annexes 2026-2027 and standard application form: Part B of
    actual-cost RIA/IA proposals limited to 40 pages (45 for lump-sum RIA/IA); excess pages are
    disregarded by evaluators. The benchmark calls are actual-cost RIAs. Converted at 450 words per page (A4, 11 pt,
    15 mm margins, typical table density), tables included.

required_sections:
  - {id: "1", title: Excellence}
  - {id: "1.1", title: Objectives and ambition, parent: "1"}
  - {id: "1.2", title: Methodology, parent: "1"}
  - {id: "2", title: Impact}
  - {id: "2.1", title: Project's pathways towards impact, parent: "2", aliases: [Pathways towards impact, Pathways to impact]}
  - {id: "2.2", title: "Measures to maximise impact: dissemination, exploitation and communication", parent: "2", aliases: [Measures to maximise impact, "Dissemination, exploitation and communication"]}
  - {id: "2.3", title: Summary, parent: "2", aliases: [Summary of the impact section, Key elements of the impact section]}
  - {id: "3", title: Quality and efficiency of the implementation, aliases: [Implementation]}
  - {id: "3.1", title: Work plan and resources, parent: "3"}
  - {id: "3.2", title: Capacity of participants and consortium as a whole, parent: "3", aliases: [Capacity of participants, Consortium as a whole]}

eligibility:
  budget_in_narrative: true
  currency: EUR
  consortium:
    min_entities: 3
    min_countries: 3
    notes: The consortium must include, as beneficiaries, at least three mutually independent legal entities
      established in three different EU Member States or Associated Countries, including at least one
      entity established in a Member State. Affiliated entities and associated partners do not count towards
      this minimum.
fixed_items:
  expected_outcomes: []
  scope: []
  exclusions: []
  mandatory_elements:
    - id: ME1
      text: Open science practices, including FAIR research data management and open access to publications and, where possible, data and tools.

author_notes: |
  A Horizon Europe work-programme topic has: Expected outcome (3-5 outcomes, each concrete and
  checkable; projects must contribute to all), Scope (an intro paragraph on the problem, then
  4-6 activities proposals should address), out-of-scope exclusions (1-2, realistic, stated in
  the scope text), and topic-specific conditions (2-4 mandatory elements, e.g. multi-actor
  approach, gender dimension, social sciences and humanities integration, collaboration with
  other projects, do-no-significant-harm, citizen engagement). A RIA ends at TRL 6 at most.
  Call conditions to choose (realistic for the cluster): EU contribution per project
  (eligibility.max_budget, EUR 3-10 million), number of projects (1-4), maximum duration
  (eligibility.duration_months_max, 36-60 months), TRL start/end when the topic is
  technological (omit for purely social-science topics). The consortium rule above is fixed.
  Do not quote real topic identifiers or real projects; everything topic-specific is invented
  but must be scientifically plausible and current.

call_md: |
  # Call for proposals — topic {{topic_code}}

  > This call is fictional and was written for ProposalBench. The topic (title, expected
  > outcomes, scope, exclusions and topic conditions), its identifier, the budget and the duration
  > are invented. The award criteria, scoring, Part B template, page limit and consortium rule
  > follow Horizon Europe Research and Innovation Actions (actual costs) under the 2026–2027 Work
  > Programme; see Sources.

  ## {{topic_code}}: {{title}}

  {{header_table}}

  ### Expected outcome

  {{expected_outcomes_intro}}

  {{expected_outcomes}}

  ### Scope

  {{scope_intro}}

  {{scope}}

  The following are **out of scope**:

  {{exclusions}}

  ### Specific conditions

  {{specific_conditions}}

  ## Award criteria and scoring

  Proposals are evaluated by independent experts against three criteria, each scored from 0 to 5
  (half points allowed). The threshold is 3 for each criterion and 10 for the total.

  1. **Excellence**: clarity and pertinence of the project's objectives and the extent to which the
     proposed work is ambitious and goes beyond the state of the art; soundness of the proposed
     methodology, including the underlying concepts, models and assumptions, interdisciplinary
     approaches, appropriate consideration of the gender dimension in research and innovation
     content, and the quality of open science practices, including sharing and management of
     research outputs and engagement of citizens, civil society and end-users where appropriate.
  2. **Impact**: credibility of the pathways to achieve the expected outcomes and impacts specified
     in the work programme; suitability and quality of the measures to maximise expected outcomes
     and impacts, as set out in the dissemination and exploitation plan, including communication
     activities.
  3. **Quality and efficiency of the implementation**: quality and effectiveness of the work plan,
     assessment of risks, and appropriateness of the effort assigned to work packages and of the
     resources overall; capacity and role of each participant, and extent to which the consortium
     as a whole brings together the necessary expertise.

  ## Proposal template (Part B, technical description)

  Write Part B with exactly these sections:

  1. **Excellence**
     - 1.1 Objectives and ambition
     - 1.2 Methodology
  2. **Impact**
     - 2.1 Project's pathways towards impact
     - 2.2 Measures to maximise impact: dissemination, exploitation and communication
     - 2.3 Summary (key elements of the impact section). **Benchmark layout restriction:** this
       section is optional in the official 2026-2027 RIA/IA template and required here.
  3. **Quality and efficiency of the implementation**
     - 3.1 Work plan and resources: a brief presentation of the work plan, followed by a list of
       work packages, a description of each work package, the list of deliverables, the list of
       milestones, the critical risks with risk-mitigation measures, a table of staff effort
       (person-months per participant and work package), a description and justification of
       each participant's subcontracting costs where applicable, the justification of equipment
       costs for each participant whose equipment costs exceed 15% of its personnel costs, and the
       total requested EU contribution (entered in Part A of a real application; stated here
       because this narrative has no Part A).
     - 3.2 Capacity of participants and consortium as a whole

  ## Length

  Part B (sections 1 to 3) is limited to 40 pages. **Benchmark adaptation:** the limit is enforced
  as **{{max_words}} words** counted over sections 1 to 3, tables included, excluding the proposal
  title and the reference list, with zero tolerance. Text beyond the limit is not evaluated, just as
  evaluators disregard excess pages.

  ## Sources

  - Horizon Europe Work Programme 2026–2027, Part 15: General Annexes (admissibility and page
    limits, award criteria, scoring and thresholds), on the Funding & Tenders Portal reference
    documents page:
    https://ec.europa.eu/info/funding-tenders/opportunities/portal/screen/how-to-participate/reference-documents;programCode=HORIZON
  - Standard application form, Part B, HE RIA/IA:
    https://ec.europa.eu/info/funding-tenders/opportunities/docs/2021-2027/horizon/temp-form/af/af_he-ria-ia_en.pdf


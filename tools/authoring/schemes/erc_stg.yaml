  other official EU languages with an English abstract. No thematic additions permitted.
  Resources are the Part A narrative represented here, not extra Part II pages. The amended
  WP explicitly gives that narrative 2 pages. Host letters and administrative forms are
  outside the benchmark deliverable. No rubric section-ID mismatch.

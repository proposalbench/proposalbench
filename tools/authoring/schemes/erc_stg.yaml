  1 January 2026 and first-PhD defence dates 1 January 2019 through 31 December 2023.
  Eligibility.max_budget is the absolute envelope including the largest conditional top-up,
  not an unconditional ordinary cap. ME6 and call_md enforce the ordinary EUR 1.5m ceiling,
  pro-rating and conditional top-ups, which Eligibility cannot represent separately.

  structure and the matrix's >2 to <=7-year window. This is a fictional 2027-labelled call
  with an invented reference date of 1 January 2027, NOT the official ERC-2027-STG call.
  The real 2027 programme has broadened eligibility (0-10 years); see https://erc.europa.eu/news-events/news/new-erc-work-programme-sets-out-2027-funding-opportunities
  and https://erc.europa.eu/news-events/news/changes-2026-and-2027-work-programmes.

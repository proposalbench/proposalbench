  ## Exclusions

  {{exclusions}}

  ## Specific conditions and mandatory elements

  {{specific_conditions}}

  ## Required narrative

  ### 1. Excellence

  #### 1.1 Objectives and ambition
  State verifiable objectives, relevance to the topic, the advance over existing knowledge and the starting and intended maturity where relevant.

  #### 1.2 Methodology
  Explain the overall approach, assumptions and links from methods to objectives. Address methodological challenges, interdisciplinarity where relevant, gender in research content, and proportionate open science. This is a concise outline, not the full implementation plan.

  ### 2. Impact

  #### 2.1 Project’s pathways towards impact
  Explain who benefits, how results contribute to the stated topic outcomes, and the assumptions and external barriers. Provide quantified estimates where possible and meaningful. Consider mitigations for uptake barriers. Do not add stage-2 sections 2.2, 2.3 or 3; a detailed dissemination/exploitation/communication plan and implementation tables are outside this deliverable.

  ## Award criteria

  Excellence and Impact alone are evaluated, each 0–5 with equal weight. Excellence covers the objectives, ambition beyond the state of the art and soundness of the overall methodology, including its concepts, models, assumptions, interdisciplinary approaches, sex/gender analysis and open science practices. Impact covers the credibility of the pathways to the specified outcomes and impacts. This fictional topic specifies its expected effects through those outcomes. Only the first-stage aspects of the General Annexes apply. Each criterion requires at least 4. The overall threshold is set per budget envelope to admit proposals requesting as close as possible to three times, and not less than twice, the available budget. It is normally 8 or 8.5, not a guaranteed fixed 8. Passing invites a full second-stage application; it is not an award.

  ## Length contract

  The official first-stage limit is 10 pages for all Part B material, including references, tables and figures. At 500 words/page (A4, 11-point reference font, at least 15 mm margins), the binding benchmark ceiling is {{max_words}} words, counting all narrative, headings and references. Excess text is disregarded with zero tolerance. This is a practical prose estimate, not an official word limit.

  ## Sources

  Verified 2026-10-31; policy paraphrases, not an official funding notice.

  # {{title}} — {{topic_code}}

  > Fictional ProposalBench two-stage RIA call. Topic, identifier, award ceiling, duration and deadline are invented. Stage-1 structure follows the 2026–2027 standard form (V5.0, 5 November 2025).

  ## Purpose and eligibility

  Submit the first-stage outline only. Eligibility is checked at each stage: the consortium declared at this first stage must already meet the three-entity, three-country rule stated below, and any change for the second stage must keep meeting it. No detailed budget or implementation section is requested at this stage. The award ceiling and maximum duration are fictional topic conditions stated in the table below. The fictional stage-1 deadline is 15 September 2027. This benchmark variant does not use blind evaluation; the General Annexes require anonymity only where the topic specifies it.

  {{header_table}}

  ## Expected outcomes


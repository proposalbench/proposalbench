      prestación de talleres.
  - id: v2-foundation-weak-signals
    scheme: foundation_concept
    skeleton: foundation_concept
    language: en
    author: openai
    topic_code: PB2-FOUNDATION-01
    conditions: {max_budget: 100000, duration_months_max: 24}
    title: "Fictional research foundation: recovering weak signals"
    theme: >-
      Entirely fictional private foundation, no claim of fidelity to a named funder. Deadline
      15 September 2027. Two-to-three-page concept note on methods for recovering weak signals from
      incomplete scientific or cultural observations; specify a falsifiable question, initial
      feasibility, uncertainty and a follow-on decision. Astronomy and cultural acoustics are
      illustrative domains. Required short funding request, indicative allocation, timeline,

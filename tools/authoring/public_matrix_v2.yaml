      EUR 25,000–100,000 total including indirect costs over 12–24 months; no major equipment
      purchase above EUR 20,000. Doctoral
      leads need an existing host and responsible faculty sponsor. No full-grant attachments.

dossiers:
  - id: v2-multilingual-practicum-alliance
    author: google
    applicant_type: consortium
    career_stage: mid_career
    language: es
    country: ES
    method_profile: mixed
    disciplines: [lingüística aplicada, educación superior, evaluación del aprendizaje]
    research_dna: >-
      Variant cross-language: all dossier documents in Spanish, proposals in English. As of
      1 October 2026, a fictional Spanish HEI coordinates independent Portuguese and Slovenian
      HEIs; all three hold valid ECHE charters and have existed since before 2018. Two Spanish
      faculties are departments of the coordinator, not separate entities. A completed 2024-25
      multilingual placement pilot involved 120 students (40 per HEI); 96 supplied paired
      assessments, mean improvement 0.24 SD, 95% CI 0.05 to 0.43, without random allocation.
      Faculty teams combine linguistics, education and accessibility, with one arts educator.
      Existing signed collaboration covers curriculum design; no new placements are recruited.
      Established small-group teaching can transfer to accessible collaborative studios, but
      specialist audio-description training and external placements must be planned. Keep the
      24 students without paired assessment visible, and distinguish all 120 enrolled from 96
      paired. No three-country alternative exists if either foreign HEI is removed.
  - id: v2-accessible-music-teaching-alliance
    author: openai
    applicant_type: consortium
    career_stage: senior
    language: en
    country: FI
    method_profile: mixed
    disciplines: [music, higher education, inclusive pedagogy, applied linguistics]
    research_dna: >-
      Variant thin: deliberately missing the number of existing accessible placements and
      the baseline rate of disabled-student participation; use labelled placeholders, not zero
      or guessed history. Fictional independent charter-holding HEIs in Finland, Croatia and
      Belgium, all established before 2018, have a signed teaching collaboration. Their 2025
      studio pilot enrolled 72 students, 60 completing paired assessment; improvement 0.18 SD
      with 95% CI -0.03 to 0.39. A qualified language-support lecturer can lead multilingual
      adaptation, but no translation curriculum is already validated. As of 1 October 2026 the
      proposed 12-placement network has no signed placement agreements and no recruited
      placements; existing provision cannot be quantified from the records. Available resources
      are three studios and captioning software; a consortium accessibility officer oversees
      evaluation. Music-performance activity alone is not evidence of improved learning.
  - id: v2-migrant-service-deliberation-network
    author: anthropic
    applicant_type: consortium
    career_stage: senior
    language: en
    country: BE
    method_profile: mixed
    disciplines: [law, public administration, migration sociology]
    research_dna: >-
      Variant internally inconsistent: the signed 2025 annual report says 84 unique residents
      completed the same eight deliberation sessions, while the undated attendance consolidation
      for those sessions says 96 unique residents; neither supersedes the other and deduplication
      is unavailable. Flag the unresolved count or use a placeholder, never silently select one.
      Fictional nonprofit Belgian coordinator and independent French and Portuguese nonprofit
      beneficiaries have signed agreements. A Belgian municipal cultural office is an
      associated participant, not an independent foreign beneficiary. Existing facilitators
      combine administrative-law and migrant-community practice; a cultural-space consultation
      is a plausible extension with planned heritage expertise. As of 1 October 2026, participant
      protocol requires separate opt-in for identifiable public case stories, with no such
      permissions collected. Dossier-only fact: a 15 September withdrawal log removes six
      case-story records from future external use; only aggregate themes may be disseminated.
      The remaining archive supports internal analysis; permission for other public stories
      would need to be sought. Existing signed beneficiary agreements remain valid.
  - id: v2-community-heritage-civic-network
    author: google
    applicant_type: consortium
    career_stage: mid_career
    language: en
    country: IT
    method_profile: qualitative
    disciplines: [music, cultural heritage, migration sociology, public administration]
    research_dna: >-
      Fictional Italian nonprofit coordinator with independent Greek and Spanish nonprofit
      beneficiaries, signed collaboration and three experienced community facilitators.
      Completed 2025 listening workshops produced 48 interviews and 120 coded recommendations;
      18 recommendations received a written municipal response, so uptake is not 48 of 48 or
      100 percent. A EUR 40,000 municipal application remains pending as of 1 October 2026, with
      no award letter. Prior work concerns shared cultural space; a service-access deliberation
      can adapt the facilitation method with planned public-service specialists. Dossier-only
      fact: the audio archive's contributor agreement permits internal noncommercial analysis
      but forbids uploading recordings to third-party transcription services; local transcription
      is permitted and an existing offline workstation is available. The restriction applies
      equally to consented recordings. Public outputs may use authorised aggregate themes.
  - id: v2-coastal-transport-observatory
    author: openai
    applicant_type: consortium
    career_stage: senior
    language: en
    country: PT
    method_profile: quantitative
    disciplines: [oceanography, hydrology, environmental chemistry, urban planning]
    research_dna: >-
      Fictional independent Portuguese marine institute, Spanish university and Irish planning
      institute, with signed consortium participation. Prior 2024-25 observations span 18 storms
      at six estuarine stations; cross-validated plume-arrival error 2.8 hours, bootstrap 95% CI
      2.1 to 3.7 hours. Adding urban drainage observations is a feasible stretch through the
      Irish partner, but no prospective city intervention has been evaluated. The earlier model
      reduced mean absolute error from 4.0 to 2.8 hours (30 percent), not 70 percent. Dossier-only
      fact as of 1 October 2026: the consortium's only research vessel is out of service until
      after the proposed first sampling season; shore stations remain accessible and a new
      charter can be proposed but is not booked. Existing expertise permits a shore-based
      design or prospective charter; no claim of an operating vessel is supportable.
  - id: v2-estuary-neighbourhood-planning-consortium
    author: anthropic
    applicant_type: consortium
    career_stage: phd
    language: en
    country: NL
    method_profile: mixed
    disciplines: [architecture and urban planning, oceanography, public administration]
    research_dna: >-
      Career stage records the focal doctoral researcher, not the legal coordinator: an existing
      senior faculty coordinator at a fictional Dutch university signs for a consortium with
      independent German hydrology and Danish marine institutes. All have participation
      agreements. A 2025 analysis covered 240 blocks, with flood-depth RMSE 0.19 m (spatial
      bootstrap 95% CI 0.15 to 0.25 m); resident workshops involved 36 adults. The doctoral
      candidate leads spatial analysis under supervision, not the whole consortium. Coastal
      exposure research can extend the Danish sampling expertise; new chemistry assays remain
      planned. Dossier-only fact: the household geolocation agreement permits analysis only in
      the university secure environment and prohibits transfer of row-level data to partner
      laptops; partners may receive disclosure-checked aggregates. Separately, the workshop
      protocol prohibits recruiting minors until an approved amendment and guardian process
      exist; neither exists on 1 October 2026. Adult-only co-design is already feasible.
  - id: v2-secure-food-robotics-consortium
    author: google
    applicant_type: consortium
    career_stage: mid_career
    language: en
    country: DE
    method_profile: quantitative
    disciplines: [computer security, robotics, food microbiology, systems engineering]
    research_dna: >-
      Fictional German university coordinator, independent Italian robotics SME, Spanish food
      microbiology institute and Austrian logistics cooperative have signed participation.
      A Canadian informal contact is not a beneficiary or an EU/associated-country entity for
      the stated minimum. Completed 2025 replay tests on 80 sensor traces detected 68 injected
      faults (85 percent, Wilson 95% CI approximately 76 to 91 percent); these were simulations,
      not live warehouse validations. A planned 30-device robot fleet has zero units acquired;
      six existing bench robots suffice for an initial bounded study. Cold-chain adaptation can
      combine the Spanish laboratory and Austrian operator. Dossier-only fact: an operator
      notice dated 21 September 2026 withdraws access to live refrigeration control interfaces;
      read-only monitoring remains authorised, and an isolated thermal bench is available.
      No medicinal-product development expertise or approval exists; the lab can assay food
      samples. Full validation of changed operating policies must be planned with access gates.
  - id: v2-food-safety-chemistry-consortium
    author: openai
    applicant_type: consortium
    career_stage: senior
    language: en
    country: FR
    method_profile: quantitative
    disciplines: [chemistry, veterinary science, food systems, computer security]
    research_dna: >-
      Fictional independent French food institute, Polish veterinary university and Dutch
      sensor-security SME have signed agreements. Two French institute branches share one
      legal identity. A completed 2025 study measured 160 food lots with 144 complete microbial
      and sensor pairs; classifier sensitivity 0.81, bootstrap 95% CI 0.72 to 0.88 on held-out
      lots. The SME has threat-modelling expertise but no general industrial robot programme;

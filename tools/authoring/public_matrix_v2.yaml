  - id: v2-nsf-career-robust-inference
    scheme: nsf_career
    skeleton: nsf_career
    language: en
    author: google
    topic_code: PB2-NSF-CAREER-02
    title: "CAREER-style emphasis: robust inference from constrained sensors"
    theme: >-
      Fictional CAREER-style solicitation, deadline 15 September 2027. Advance fundamental theory
      or systems methods for inference under faulty, sparse or adversarial sensing, with a
      five-year integrated research and education plan. Mathematical limits, proof techniques

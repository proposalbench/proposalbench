      Same single-PI eligibility as the paired CAREER call; no co-PIs. State educational
      objectives, evaluation and Broader Impacts. No narrative budget or invented attachments.
  - id: v2-erc-poc-field-translation
    scheme: erc_poc
    skeleton: erc_poc
    language: en
    author: openai
    topic_code: PB2-ERC-POC-01
    title: "Proof of Concept: innovation arising from ERC research, window A"
    theme: >-
      Fictional ERC PoC window, deadline 15 September 2027; bottom-up, without subject restrictions.

  - id: v2-aei-oriented-cultural-care
    scheme: aei_pid_orientada
    skeleton: aei_pid_orientada
    language: es
    author: openai
    topic_code: PB2-AEI-OR-02
    title: "Investigación orientada: participación cultural y redes rurales de cuidados"
    theme: >-
      Convocatoria ficticia, cierre 15 de septiembre de 2027. Prioridad Cultura, creatividad y
      sociedad inclusiva: investigar cómo la participación cultural y la accesibilidad
      lingüística afectan a las redes de apoyo y al acceso a cuidados de personas mayores. Una

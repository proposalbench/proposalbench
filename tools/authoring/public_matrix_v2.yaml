  - id: v2-foundation-sparse-records
    scheme: foundation_concept
    skeleton: foundation_concept
    language: en
    author: google
    topic_code: PB2-FOUNDATION-02
    conditions: {max_budget: 100000, duration_months_max: 24}
    title: "Fictional research foundation: auditable inference from sparse records"
    theme: >-
      Entirely fictional private foundation, deadline 15 September 2027. Two-to-three-page concept
      note on reproducible interpretation of incomplete scientific or cultural records, with
      provenance, missingness and uncertainty central to the method. Archival, linguistic and
      observational-science projects qualify; generic digitisation without an inference

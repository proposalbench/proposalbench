  - id: v2-erc-poc-workflow-transfer
    scheme: erc_poc
    skeleton: erc_poc
    language: en
    author: anthropic
    topic_code: PB2-ERC-POC-02
    title: "Proof of Concept: innovation arising from ERC research, window B"
    theme: >-
      Fictional ERC PoC window, deadline 15 September 2027; same bottom-up eligibility and EUR

  - id: v2-nsf-career-verified-autonomy
    scheme: nsf_career
    skeleton: nsf_career
    language: en
    author: anthropic
    topic_code: PB2-NSF-CAREER-01
    title: "CAREER-style emphasis: verifiable distributed autonomy"
    theme: >-
      Fictional CAREER-style solicitation, deadline 15 September 2027, preserving the frozen

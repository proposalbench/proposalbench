# Public split v2: 20 additional calls, 20 dossiers, 40 tasks; v1 remains unchanged.
# All biographies, institutions, projects and prior awards are fictional. As-of: 2026-10-01.
# All call deadlines: 2027-09-15 (fictional, not a real scheme deadline).
# Skeletons supply fixed rules; themes below supply explicit fictional topic conditions.
# Authors are planned assignments, not claims that generation/review has already happened.
# Variants are recorded in research_dna: exactly two thin, two inconsistent, two cross-language,
# and four resubmission dossiers. Do not repair away an intentional unresolved inconsistency.
# All T12 conflicting facts stay in dossier documents only; ideas are hidden authoring notes.
# v1 trap baseline: the audited classification in v1_trap_types.yaml (37); v2 adds 63.
families:
  anthropic: {provider: claude, model: opus}
  google: {provider: google, model: gemini-3.1-pro-preview}
  openai: {provider: codex, model: gpt-6-astra}

calls:
  - id: v2-ka220-multilingual-practice
    scheme: erasmus_ka220
    skeleton: erasmus_ka220
    language: en
    author: anthropic
    topic_code: PB2-KA220-HED-01
    conditions: {max_budget: 400000, duration_months_max: 36}
    title: "Multilingual practice studios in higher education"
    theme: >-
      Fictional KA220-HED topic, deadline 15 September 2027, following the frozen 2026
      cooperation partnership structure. Develop and embed inclusive multilingual practical
      teaching across a partnership that meets the programme rule of at least three
      organisations from three programme countries (participating HEIs hold a valid charter;
      faculties of one HEI are one organisation), with assessed learner outcomes, staff
      development and sustainable curriculum adoption. Linguistics, arts and professional
      education routes are welcome. Research supports teaching improvement; a stand-alone
      language-model benchmark is outside the topic. Grant choice is one of EUR 120,000,
      250,000 or 400,000, not an arbitrary amount below a cap. The narrative must state the
      selected lump sum and allocate it coherently to work packages. Describe partner legal
      identities, charter status and country, inclusion and evaluation.
  - id: v2-ka220-accessible-studios
    scheme: erasmus_ka220
    skeleton: erasmus_ka220
    language: en
    author: google
    topic_code: PB2-KA220-HED-02
    conditions: {max_budget: 400000, duration_months_max: 36}
    title: "Accessible collaborative studios and placement learning"
    theme: >-
      Fictional KA220-HED topic, deadline 15 September 2027. Co-create accessible
      collaborative studios and placement teaching for students with sensory or language
      access barriers; compare participation and assessed learning, train staff and secure
      institutional uptake. The programme rule applies: at least three organisations from
      three programme countries, participating HEIs with a valid charter; multiple departments
      of one HEI remain one organisation. Arts or language-practice routes are possible. Grant
      choice EUR 120,000, 250,000 or 400,000; state and allocate the selected lump sum in the
      narrative. Include the skeleton's impact and dissemination content, accessibility
      measures, baseline limitations and an evaluation plan.
  - id: v2-cerv-service-voice
    scheme: cerv
    skeleton: cerv
    language: en
    author: openai
    topic_code: PB2-CERV-CIV-01
    conditions: {max_budget: 300000, duration_months_max: 24}
    title: "Equal voice in local public-service decisions"
    theme: >-
      Fictional CERV citizens-engagement sub-priority 2.1 topic, deadline 15 September 2027.
      Enable residents facing language and migration-related barriers to participate in
      deliberation about public services, with accessible assemblies, feedback to authorities
      and documented responses, connecting deliberation to EU policymaking on inclusion and
      access. Follow sub-priority 2.1's eligibility as stated in the skeleton (at least two
      independent beneficiaries in two eligible countries); add no narrower consortium
      restriction. Associated participants do not replace beneficiaries. Explain roles,
      recruitment, safeguarding, meaningful participation and outcome evaluation in the
      narrative. Migration-status casework and academic publications alone do not deliver this
      topic.
  - id: v2-cerv-cultural-participation
    scheme: cerv
    skeleton: cerv
    language: en
    author: anthropic
    topic_code: PB2-CERV-CIV-02
    conditions: {max_budget: 300000, duration_months_max: 24}
    title: "Shared cultural spaces for civic participation"
    theme: >-
      Fictional CERV citizens-engagement sub-priority 2.1 topic, deadline 15 September 2027.
      Use community cultural spaces and participatory interpretation of local heritage to
      involve excluded residents in democratic decisions, including an actionable dialogue
      with local authorities. Attendance at performances alone is insufficient; explain how
      residents influence decisions and how responses inform EU policymaking on inclusion and
      cultural participation. Apply sub-priority 2.1's two-beneficiary/two-country rule as
      stated in the skeleton; add no narrower consortium restriction. Associated entities do
      not count. Describe participant protection, accessible engagement, event-based work
      packages with verifiable direct participation, and public outputs.
  - id: v2-he-stage1-coastal-exposure
    scheme: horizon_stage1
    skeleton: horizon_stage1
    language: en
    author: google
    topic_code: PB2-HE-S1-COAST-01
    conditions: {max_budget: 5000000, duration_months_max: 48}
    title: "Coastal exposure pathways after extreme rainfall: stage 1"
    theme: >-
      Fictional HE two-stage RIA topic, stage-1 deadline 15 September 2027. Link catchment runoff,
      estuarine transport and coastal exposure pathways to usable early-warning evidence.
      Explain hypotheses, sampling or modelling design, uncertainty and beneficiary outcomes
      in Excellence and Impact only, under the reduced skeleton template. At least three
      independent legal entities in three EU/associated countries including an EU member.
      No detailed implementation or budget narrative is requested; no cost traps. This is
      the skeleton's explicitly non-blind benchmark variant, not a rule for all stage-1 calls.
      Studies solely of offshore cosmology or generic terrestrial urban design are not responsive;
      methods and outputs must concern waterborne exposure pathways. Permanent flood-barrier
      construction is excluded; temporary monitoring and modelling research are allowed.
  - id: v2-he-stage1-estuary-planning
    scheme: horizon_stage1
    skeleton: horizon_stage1
    language: en
    author: openai
    topic_code: PB2-HE-S1-ESTUARY-02
    conditions: {max_budget: 5000000, duration_months_max: 48}
    title: "Evidence for equitable estuarine flood adaptation: stage 1"
    theme: >-
      Fictional HE two-stage RIA topic, stage-1 deadline 15 September 2027. Combine estuarine flood
      and drainage science with urban planning to evaluate distributional effects of adaptation
      options. Physical observations or validated simulations must inform spatial choices and
      residents' exposure; uncertainty and co-design are part of the methodology. Construction
      of permanent flood barriers is excluded; comparative research and temporary monitoring
      are allowed. Three independent entities in three EU/associated countries including an EU
      member. Excellence and Impact only, in the skeleton's non-blind benchmark variant; no budget
      narrative or stage-2 work-package tables. Describe safe handling of resident-level data.
  - id: v2-he-digital-food-logistics
    scheme: horizon_ria
    skeleton: horizon_ria
    language: en
    author: anthropic
    topic_code: PB2-HE-CL4-FOOD-01
    conditions: {max_budget: 5000000, duration_months_max: 42}
    title: "Secure and verifiable AI for distributed food logistics"
    theme: >-
      Fictional Cluster 4 RIA, deadline 15 September 2027. Develop and evaluate resilient AI decision
      support for food logistics under sensor faults and adversarial data, with food-safety
      and loss outcomes, meaningful baselines, security evaluation and human override. Partners
      must supply both computing and food-domain competence. Generic factory robotics without
      a food-logistics demonstrator is outside the topic. Three independent entities in three
      EU/associated countries including an EU member. The implementation narrative must state
      the requested EU contribution, a consistent resource allocation and partner roles.
  - id: v2-he-food-coldchain
    scheme: horizon_ria
    skeleton: horizon_ria
    language: en
    author: google
    topic_code: PB2-HE-CL6-FOOD-02
    conditions: {max_budget: 5500000, duration_months_max: 42}
